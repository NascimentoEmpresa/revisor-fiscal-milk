<title>Revisor Fiscal PIS/COFINS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Da planilha exportada do SistemaMA ao Excel de trabalho e à minuta do diagnóstico, com pré-classificação dos créditos de PIS/COFINS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: ferramenta de trabalho. Moldura preta (barra superior, trilho de etapas e faixa de título de cada etapa),
   como os posts e relatórios da Milk; área de trabalho clara para tabelas longas (escura no tema escuro).
   Cobre é a cor da marca: destaque de números, botões principais e rótulos. Verde, âmbar e vermelho só para estado. */
:root {
  --paper: #F2F1EF;
  --surface: #FFFFFF;
  --surface-2: #F8F7F5;
  --ink: #121212;
  --ink-2: #4C4844;
  --ink-3: #85807A;
  --line: #DDD9D4;
  --line-2: #ECE9E5;
  --cell-hl: #ECEAE7;

  --chrome: #0D0D0D;
  --chrome-2: #191817;
  --chrome-line: rgba(255, 255, 255, .10);
  --chrome-ink: #F4F1EC;
  --chrome-ink-2: #A9A29A;

  --copper: #9E6846;
  --copper-ink: #8A5737;
  --copper-light: #C08A62;
  --copper-soft: rgba(158, 104, 70, .13);

  --credit: #2C7A57;
  --credit-soft: rgba(44, 122, 87, .11);
  --risk: #B23B2E;
  --risk-soft: rgba(178, 59, 46, .10);
  --warn: #9C6300;
  --warn-soft: rgba(196, 135, 20, .14);
  --info: #46627F;
  --info-soft: rgba(70, 98, 127, .11);
  --neutral-soft: rgba(76, 72, 68, .10);
  --focus: #C08A62;
  --shadow: 0 1px 2px rgba(18, 18, 18, .06), 0 10px 28px rgba(18, 18, 18, .08);

  --display: "Montserrat", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .9375rem; --fs-lg: 1.0625rem; --fs-xl: 1.375rem; --fs-2xl: 2rem;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A0A0A; --surface: #141312; --surface-2: #1A1918; --ink: #F2EFEA; --ink-2: #BAB3AB; --ink-3: #8B847D;
    --line: #2B2826; --line-2: #211F1D; --cell-hl: #22201E;
    --chrome: #050505; --chrome-2: #121110; --chrome-line: rgba(255, 255, 255, .09); --chrome-ink: #F4F1EC; --chrome-ink-2: #9D968E;
    --copper: #B07752; --copper-ink: #D19C74; --copper-light: #D19C74; --copper-soft: rgba(192, 138, 98, .16);
    --credit: #55C08F; --credit-soft: rgba(85, 192, 143, .14); --risk: #F07B6E; --risk-soft: rgba(240, 123, 110, .14);
    --warn: #E3A94A; --warn-soft: rgba(227, 169, 74, .15); --info: #8EAAC8; --info-soft: rgba(142, 170, 200, .14); --neutral-soft: rgba(186, 179, 171, .12);
    --focus: #D19C74; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A0A0A; --surface: #141312; --surface-2: #1A1918; --ink: #F2EFEA; --ink-2: #BAB3AB; --ink-3: #8B847D;
  --line: #2B2826; --line-2: #211F1D; --cell-hl: #22201E;
  --chrome: #050505; --chrome-2: #121110; --chrome-line: rgba(255, 255, 255, .09); --chrome-ink: #F4F1EC; --chrome-ink-2: #9D968E;
  --copper: #B07752; --copper-ink: #D19C74; --copper-light: #D19C74; --copper-soft: rgba(192, 138, 98, .16);
  --credit: #55C08F; --credit-soft: rgba(85, 192, 143, .14); --risk: #F07B6E; --risk-soft: rgba(240, 123, 110, .14);
  --warn: #E3A94A; --warn-soft: rgba(227, 169, 74, .15); --info: #8EAAC8; --info-soft: rgba(142, 170, 200, .14); --neutral-soft: rgba(186, 179, 171, .12);
  --focus: #D19C74; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: var(--fs-md); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.num, td.n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.label { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }

/* ---------- barra superior (moldura preta) ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--chrome); color: var(--chrome-ink); border-bottom: 1px solid var(--chrome-line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--copper-light); color: var(--chrome-ink); display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .04em; flex: none;
}
.brand-logo { height: 38px; max-width: 150px; border-radius: 19px; background: #fff; padding: 3px 10px; display: none; object-fit: contain; }
.brand.has-logo .brand-logo { display: block; }
.brand.has-logo .brand-mark { display: none; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 1.0625rem; line-height: 1.15; letter-spacing: -.01em; }
.brand-sub { color: var(--copper-light); margin-top: 2px; }
.company { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--chrome-line);
  font-size: var(--fs-xs); color: var(--chrome-ink-2); white-space: nowrap; max-width: 100%;
}
.chip b { color: var(--chrome-ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.chip.nm { max-width: min(320px, 26vw); }
@media (max-width: 1500px) and (min-width: 681px) { .company .chip.per { display: none; } }
@media (max-width: 1400px) and (min-width: 981px) { .company .chip.opt { display: none; } .chip.nm { max-width: min(300px, 24vw); } }
.chip.demo { border-color: var(--copper-light); color: var(--copper-light); font-family: var(--display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; }
.chip.mode { color: var(--chrome-ink); font-family: var(--mono); font-size: 11px; letter-spacing: .02em; }
.msw { display: inline-flex; border: 1px solid var(--chrome-line); border-radius: 999px; padding: 2px; gap: 2px; max-width: 100%; }
.msw button { border: 0; background: none; color: var(--chrome-ink-2); font-family: var(--mono); font-size: 11px; letter-spacing: .02em; padding: 3px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.msw button:hover { color: var(--chrome-ink); }
.msw button[aria-pressed="true"] { background: var(--copper); color: #fff; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; font-size: var(--fs-sm); white-space: nowrap;
  font-family: var(--display); letter-spacing: .01em; transition: background .15s, border-color .15s, transform .05s, filter .15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--copper); color: #fff; border-color: var(--copper); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--chrome-ink); border-color: rgba(255, 255, 255, .22); }
.btn.ghost:hover { border-color: var(--copper-light); }
.btn.big { padding: 13px 20px; font-size: var(--fs-md); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ---------- moldura: trilho de etapas ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - var(--toph, 60px)); background: linear-gradient(to right, var(--chrome) 236px, transparent 236px); }
.rail {
  background: var(--chrome); color: var(--chrome-ink); padding: 22px 12px; position: sticky; top: var(--toph, 60px); align-self: start;
  height: calc(100vh - var(--toph, 60px)); overflow: auto; display: flex; flex-direction: column; gap: 4px;
}
.rail-label { color: var(--chrome-ink-2); padding: 0 10px 8px; }
.step {
  display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 10px;
  color: var(--chrome-ink-2); border: 1px solid transparent; cursor: pointer; background: none; text-align: left; width: 100%; font-weight: 500;
}
.step:hover { background: var(--chrome-2); color: var(--chrome-ink); }
.step[aria-current="page"] { background: var(--chrome-2); color: var(--chrome-ink); border-color: var(--chrome-line); font-weight: 600; }
.step-n {
  width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .22); display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 11.5px; color: var(--chrome-ink-2);
}
.step[aria-current="page"] .step-n { border-color: var(--copper-light); color: var(--copper-light); }
.step.done .step-n { background: var(--copper); border-color: var(--copper); color: #fff; }
.step-badge { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--chrome-ink); }
.step-badge:empty { display: none; }
.step-badge.warn { background: rgba(227, 169, 74, .2); color: #F1C27A; }
.rail-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--chrome-line); font-size: var(--fs-xs); color: var(--chrome-ink-2); display: grid; gap: 8px; }
.lock { display: flex; gap: 8px; align-items: flex-start; }
.lock svg { width: 14px; height: 14px; flex: none; margin-top: 2px; color: var(--copper-light); }

.main { min-width: 0; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }

/* faixa de título da etapa: como um post da Milk (preto, rótulo em cobre, frase-chave em cobre) */
.phead {
  background: var(--chrome); color: var(--chrome-ink); border-radius: 16px; padding: 26px 28px; display: flex; align-items: flex-end; justify-content: space-between;
  gap: 18px 24px; flex-wrap: wrap; position: relative; overflow: hidden; border: 1px solid var(--chrome-line);
}
.phead::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 1px solid rgba(192, 138, 98, .25); pointer-events: none; }
.phead > div { min-width: 0; position: relative; z-index: 1; }
.band { display: inline-block; font-family: var(--display); font-size: 10.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--copper-light); border: 1px solid rgba(192, 138, 98, .55); border-radius: 999px; padding: 4px 11px; }
.phead h1 { font-size: var(--fs-2xl); font-weight: 700; line-height: 1.15; margin-top: 14px; max-width: 26ch; }
.phead h1 em, .mark { font-style: normal; color: var(--copper-light); }
.phead p { color: var(--chrome-ink-2); margin-top: 10px; max-width: 72ch; }
.phead p b { color: var(--chrome-ink); font-weight: 600; }
.phead .toolbar { position: relative; z-index: 1; }
.phead .btn:not(.primary) { background: transparent; color: var(--chrome-ink); border-color: rgba(255, 255, 255, .22); }
.phead .btn:not(.primary):hover { border-color: var(--copper-light); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 20px 0; flex-wrap: wrap; }
.card-h h2 { font-size: var(--fs-lg); font-weight: 700; }
.card-h .sub { color: var(--ink-3); font-size: var(--fs-sm); }
.card-b { padding: 16px 20px 20px; }
.muted { color: var(--ink-3); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }

/* ---------- indicadores ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 16px 16px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi-l { font-family: var(--display); font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .12em; }
.kpi-v { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.2; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; letter-spacing: -.02em; }
.kpi-s { font-size: var(--fs-xs); color: var(--ink-2); }
.kpi.hero { background: var(--chrome); }
.kpi.hero .kpi-l { color: var(--copper-light); }
.kpi.hero .kpi-v { color: var(--copper-light); }
.kpi.hero .kpi-s { color: var(--chrome-ink-2); }
.kpi.risk .kpi-v { color: var(--risk); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 22px; }
.grid2 > * { min-width: 0; }
.grid2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
button.chip { cursor: pointer; background: transparent; font: inherit; font-size: var(--fs-xs); }
button.chip.ask { border-color: var(--copper-light); color: var(--copper-light); }

/* ---------- gráfico ---------- */
.chart-wrap { overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 640px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--chrome); color: var(--chrome-ink); padding: 9px 11px; border-radius: 10px; border: 1px solid var(--chrome-line);
  font-size: var(--fs-xs); line-height: 1.5; box-shadow: var(--shadow); max-width: 260px; opacity: 0; transition: opacity .1s;
}
.tip.on { opacity: 1; }
.tip b { font-family: var(--mono); font-weight: 500; color: var(--copper-light); }
.regime { display: grid; grid-template-columns: repeat(auto-fill, minmax(16px, 1fr)); gap: 3px; }
.regime span { height: 20px; border-radius: 3px; background: var(--copper); opacity: .8; }
.regime span.cum { background: var(--ink-3); }
.regime span.none { background: var(--line); opacity: 1; }

/* ---------- tabelas ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
th { font-family: var(--display); font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.tot td { font-weight: 700; border-top: 1.5px solid var(--ink); border-bottom: 0; }
td.hl, th.hl { background: var(--cell-hl); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
.ellip { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- classificação ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; background: var(--surface); }
.search input { border: 0; outline: 0; background: transparent; padding: 9px 0; width: 100%; min-width: 0; }
.search svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; font-size: var(--fs-sm); color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--chrome); color: var(--chrome-ink); }
.seg button[aria-pressed="true"] .ct { color: var(--copper-light); opacity: 1; }
.seg .ct { font-family: var(--mono); font-size: 11px; opacity: .75; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.COM { background: var(--credit-soft); color: var(--credit); }
.pill.SEM { background: var(--neutral-soft); color: var(--ink-2); }
.pill.AVA { background: var(--warn-soft); color: var(--warn); }
.conf { display: inline-flex; gap: 2px; vertical-align: middle; }
.conf i { width: 5px; height: 12px; border-radius: 1px; background: var(--line); }
.conf.a i, .conf.m i:nth-child(-n+2), .conf.b i:first-child { background: var(--copper); }
.cls-select { border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; background: var(--surface); font-size: var(--fs-xs); font-weight: 600; max-width: 140px; }
.cls-select.COM { color: var(--credit); border-color: color-mix(in srgb, var(--credit) 40%, var(--line)); }
.cls-select.AVA { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.edited { font-size: 10px; color: var(--copper); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-family: var(--display); }
.progress { height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; display: flex; }
.progress span { height: 100%; }
.progress .p-com { background: var(--credit); }
.progress .p-sem { background: var(--ink-3); }
.progress .p-ava { background: var(--warn); }
.bulk { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r); background: var(--copper-soft); border: 1px solid color-mix(in srgb, var(--copper) 30%, transparent); }

/* gaveta */
.scrim { position: fixed; inset: 0; background: rgba(5, 5, 5, .45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); z-index: 41; border-left: 1px solid var(--line);
  transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column; box-shadow: var(--shadow);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer.on { transform: none; }
.dr-h { padding: 20px 22px 16px; background: var(--chrome); color: var(--chrome-ink); display: flex; gap: 12px; align-items: flex-start; }
.dr-h .muted { color: var(--copper-light); }
.dr-h h3 { font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; margin-top: 4px; }
.dr-b { padding: 18px 22px 28px; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; }
.x { margin-left: auto; border: 1px solid rgba(255, 255, 255, .22); background: transparent; color: var(--chrome-ink); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; display: grid; place-items: center; flex: none; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; }
.kv div { min-width: 0; }
.kv dt { font-family: var(--display); font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.kv dd { margin: 3px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.why { border-radius: var(--r); padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--copper); display: grid; gap: 6px; }
.why .law { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-2); }
.choice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choice button { padding: 12px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; display: grid; gap: 2px; text-align: left; font-family: var(--display); font-size: var(--fs-sm); }
.choice button span { font-weight: 400; font-size: var(--fs-xs); color: var(--ink-3); font-family: var(--body); }
.choice button[aria-pressed="true"].COM { border-color: var(--credit); background: var(--credit-soft); }
.choice button[aria-pressed="true"].SEM { border-color: var(--ink-2); background: var(--neutral-soft); }
.choice button[aria-pressed="true"].AVA { border-color: var(--warn); background: var(--warn-soft); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-sm); }
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--copper); }
.desc-list { display: grid; gap: 6px; font-size: var(--fs-sm); }
.desc-list div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line-2); padding-bottom: 4px; }

/* ---------- importar ---------- */
.drop {
  border: 1.5px dashed var(--line); border-radius: 16px; background: var(--surface); padding: 34px 24px; display: grid; justify-items: center; gap: 12px; text-align: center;
  transition: border-color .15s, background .15s; align-content: center;
}
.drop > * { max-width: 100%; }
.drop.over { border-color: var(--copper); background: var(--copper-soft); }
.drop h2 { font-size: var(--fs-xl); font-weight: 700; }
.drop svg.big { width: 44px; height: 44px; color: var(--copper); }
.drop .demo-row { gap: 8px; }
.drop .demo-row > span { flex: 1 1 100%; }
details.mais { width: 100%; }
details.mais summary { cursor: pointer; font-size: var(--fs-sm); color: var(--copper-ink); font-weight: 600; list-style-position: inside; }
details.mais[open] summary { margin-bottom: 10px; }
details.mais .toolbar + .toolbar { margin-top: 10px; }
.pipeline { display: grid; }
.pl { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.pl:last-child { border-bottom: 0; }
.pl-i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.pl.run .pl-i { border-color: var(--copper); border-top-color: transparent; animation: spin .8s linear infinite; }
.pl.ok .pl-i { background: var(--copper); border-color: var(--copper); }
.pl.ok .pl-i::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.pl.err .pl-i { background: var(--risk); border-color: var(--risk); }
.pl-t { font-weight: 600; font-size: var(--fs-sm); }
.pl-d { font-size: var(--fs-xs); color: var(--ink-3); }
.pl-ms { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-2); }
@keyframes spin { to { transform: rotate(360deg); } }
.err-box { border: 1px solid var(--risk); background: var(--risk-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: var(--fs-sm); text-align: left; }

/* ---------- checklist ---------- */
.checks { display: grid; gap: 12px; }
.ck { display: grid; grid-template-columns: 5px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ck-bar { background: var(--line); }
.ck.ok .ck-bar { background: var(--credit); }
.ck.opp .ck-bar { background: var(--copper); }
.ck.risk .ck-bar { background: var(--risk); }
.ck.warn .ck-bar { background: var(--warn); }
.ck.info .ck-bar { background: var(--info); }
.ck-b { padding: 14px 18px; display: grid; gap: 8px; min-width: 0; }
.ck-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ck-top h3 { font-size: var(--fs-md); font-weight: 700; }
.ck-n { font-family: var(--display); font-weight: 700; font-size: var(--fs-xs); color: var(--copper); }
.st { font-family: var(--display); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
.st.ok { background: var(--credit-soft); color: var(--credit); }
.st.opp { background: var(--copper-soft); color: var(--copper-ink); }
.st.risk { background: var(--risk-soft); color: var(--risk); }
.st.warn { background: var(--warn-soft); color: var(--warn); }
.st.info { background: var(--info-soft); color: var(--info); }
.ck-val { margin-left: auto; font-family: var(--mono); font-weight: 600; }
.ck-txt { font-size: var(--fs-sm); color: var(--ink-2); }
details.rep { font-size: var(--fs-sm); }
details.rep summary { cursor: pointer; color: var(--copper-ink); font-weight: 600; }
details.rep blockquote { margin: 8px 0 0; padding: 10px 14px; border-left: 3px solid var(--copper); background: var(--surface-2); border-radius: 0 8px 8px 0; }

/* ---------- exportar ---------- */
.exports { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.xp { display: grid; gap: 12px; align-content: start; padding: 20px; }
.xp h3 { font-size: var(--fs-lg); font-weight: 700; }
.file-ic { width: 40px; height: 48px; border-radius: 6px; display: grid; place-items: end start; padding: 5px; font-family: var(--mono); font-weight: 600; font-size: 10px; color: #fff; }
.file-ic.fx { background: #1D6F42; } .file-ic.fw { background: #2B579A; } .file-ic.fj { background: var(--copper); }
.tabs-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs-list span { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.ready { list-style: none; margin: 0; padding: 0; display: grid; }
.ready > li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line-2); }
.ready > li:first-child { padding-top: 2px; }
.ready .toolbar { flex-wrap: nowrap; }
.rd-i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; align-self: start; margin-top: 2px; }
.rd.ok .rd-i { background: var(--credit); border-color: var(--credit); }
.rd.ok .rd-i::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.rd.warn .rd-i { border-color: var(--warn); background: var(--warn-soft); }
.rd.warn .rd-i::after { content: "!"; font: 700 12px/1 var(--display); color: var(--warn); }
.rd .field input { max-width: 520px; }
.rd.need input { border-color: var(--risk); box-shadow: 0 0 0 3px var(--risk-soft); }
.ready .logo-prev { height: 40px; min-width: 0; padding: 4px 8px; }
.ready .logo-prev img { max-height: 30px; max-width: 140px; }
.sec-h { font-family: var(--display); font-size: var(--fs-lg); font-weight: 700; margin: 6px 2px -6px; }
.go-all { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-top: 16px; }
.go-all .btn { min-width: 220px; }
.rel-cols { gap: 24px; }
.rel-list { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: var(--fs-sm); }
.rel-list.ok li::marker { content: "✓  "; color: var(--credit); }
.rel-list.pend li::marker { content: "●  "; color: #C9A400; }
mark { background: #FFF200; color: #111; padding: 0 3px; border-radius: 3px; }
.field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.field label { font-family: var(--display); font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; }
.field input[type="text"], .field input[type="number"] { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); width: 100%; min-width: 0; }
.toggle { display: flex; gap: 10px; align-items: flex-start; }
.toggle input { width: 18px; height: 18px; accent-color: var(--copper); margin-top: 2px; flex: none; }
.logo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo-prev { height: 54px; min-width: 110px; border: 1px dashed var(--line); border-radius: 10px; display: grid; place-items: center; padding: 6px 10px; background: #fff; color: #85807A; font-size: var(--fs-xs); }
.logo-prev img { max-height: 42px; max-width: 200px; display: block; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--chrome); color: var(--chrome-ink);
  border: 1px solid var(--chrome-line); padding: 10px 18px; border-radius: 999px; font-size: var(--fs-sm); z-index: 60; opacity: 0; transition: all .2s; pointer-events: none; max-width: calc(100% - 32px);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* tempo */
.time { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.time-col { display: grid; gap: 4px; }
.time-big { font-family: var(--display); font-weight: 700; font-size: 1.75rem; line-height: 1.15; letter-spacing: -.02em; }
.bar-cmp { display: grid; gap: 8px; margin-top: 4px; }
.bar-cmp div { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: var(--fs-xs); color: var(--ink-2); }
.bar-cmp i { display: block; height: 12px; border-radius: 6px; background: var(--ink-3); opacity: .55; }
.bar-cmp i.fast { background: var(--copper); opacity: 1; }
details.prem summary { cursor: pointer; font-size: var(--fs-sm); color: var(--copper-ink); font-weight: 600; }
.prem-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.foot { color: var(--ink-3); font-size: var(--fs-xs); text-align: center; padding-top: 8px; }


/* ---------- entrada: símbolo que rola até o meio, e-mail e senha, fundo desfocado ---------- */
.login { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; color: var(--ink); padding: 24px 16px; overflow: auto; }
.login[hidden] { display: none; }
.login-veil { position: fixed; inset: 0; background: color-mix(in srgb, var(--paper) 58%, transparent); -webkit-backdrop-filter: blur(16px) saturate(.85); backdrop-filter: blur(16px) saturate(.85); }
.login-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.login-box { position: relative; display: grid; justify-items: center; }
.login-logo { width: min(190px, 46vw); height: auto; opacity: 0; border-radius: 50%; background: var(--surface); box-shadow: 0 14px 40px rgba(0, 0, 0, .12); }
.login.in .login-logo { animation: rf-roll 1.5s cubic-bezier(.2, .75, .25, 1) both; }
/* 1ª animação: o símbolo entra pela borda esquerda da tela, rolando, e para no meio */
@keyframes rf-roll { 0% { opacity: 1; transform: translateX(calc(-50vw - 110%)) rotate(-420deg); } 100% { opacity: 1; transform: none; } }
/* 2ª animação (acesso certo): o símbolo pulsa no meio por 1,5 s e depois se desfaz em partículas (feito no script) */
.login.in.ok .login-logo { animation: rf-pulse 1.3s ease-in-out .2s both; }
@keyframes rf-pulse { 0%, 100% { opacity: 1; transform: none; box-shadow: 0 14px 40px rgba(0, 0, 0, .12); }
  50% { opacity: 1; transform: scale(1.07); box-shadow: 0 0 0 12px color-mix(in srgb, var(--copper) 22%, transparent), 0 18px 48px rgba(0, 0, 0, .18); } }
.login-form { display: grid; gap: 12px; width: min(330px, 84vw); margin-top: 30px; max-height: 460px; overflow: hidden; padding: 2px; opacity: 0; transform: translateX(calc(-50vw - 100%));
  transition: opacity .5s ease 1.05s, transform .8s cubic-bezier(.2, .75, .25, 1) 1.05s, max-height .55s cubic-bezier(.4, 0, .2, 1), margin .55s cubic-bezier(.4, 0, .2, 1); }
.login.in .login-form { opacity: 1; transform: none; }
.login.ok .login-form { opacity: 0; max-height: 0; margin-top: 0; pointer-events: none; transition: opacity .28s ease, max-height .55s cubic-bezier(.4, 0, .2, 1) .12s, margin .55s cubic-bezier(.4, 0, .2, 1) .12s; }
.login.out .login-veil, .login.out .login-logo { opacity: 0 !important; transition: opacity .42s ease; }
.login-tit { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--copper-ink); text-align: center; margin-bottom: 2px; }
.lf { display: grid; gap: 6px; text-align: left; }
.lf label { font-family: var(--display); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.lf input { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: color-mix(in srgb, var(--surface) 90%, transparent); font-size: 15px; color: var(--ink); width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.lf input:focus { outline: none; border-color: var(--copper); box-shadow: 0 0 0 3px color-mix(in srgb, var(--copper) 22%, transparent); }
.pw { position: relative; }
.pw input { padding-right: 46px; }
.pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; width: 36px; height: 36px; border-radius: 9px; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; }
.pw-eye[aria-pressed="true"] { color: var(--copper); }
.lg-err { min-height: 18px; font-size: var(--fs-sm); color: var(--risk); text-align: center; font-weight: 600; }
.login-form .btn { width: 100%; }
.login-form.shake { animation: rf-shake .42s; }
@keyframes rf-shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login-logo { filter: invert(1); } }
:root[data-theme="dark"] .login-logo { filter: invert(1); }

/* ---------- topo: MILK ADVOCACIA letra a letra ---------- */
.typing { display: flex; white-space: nowrap; min-height: 1.2em; }
.typing span { display: inline-block; animation: rf-type 5.4s cubic-bezier(.2, .7, .2, 1) infinite both; animation-delay: calc(var(--i) * 85ms); }
@keyframes rf-type { 0% { opacity: 0; transform: translateY(4px); filter: blur(2px); } 4% { opacity: 1; transform: none; filter: none; } 68% { opacity: 1; transform: none; } 74% { opacity: 0; transform: translateY(-3px); } 100% { opacity: 0; } }
.brand.has-logo.round .brand-logo { width: 40px; height: 40px; max-width: none; padding: 2px; border-radius: 50%; }

/* ---------- etapas indisponíveis antes de importar ---------- */
.step.off { opacity: .45; }
.step.off:hover { background: none; color: var(--chrome-ink-2); }

/* ---------- perfil ---------- */
.rail-foot { padding: 12px 0 0; }
.profile-btn { display: grid; grid-template-columns: 38px minmax(0, 1fr) 16px; gap: 10px; align-items: center; width: 100%; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--chrome-line); background: var(--chrome-2); color: var(--chrome-ink); cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
.profile-btn:hover { border-color: var(--copper-light); }
.profile-btn svg { width: 16px; height: 16px; color: var(--chrome-ink-2); }
.pf-txt { display: grid; min-width: 0; line-height: 1.25; }
.pf-txt b { font-family: var(--display); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pf-txt span { font-size: var(--fs-xs); color: var(--chrome-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--copper), var(--copper-light)); color: #fff; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .04em; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--chrome), 0 0 0 3px color-mix(in srgb, var(--copper-light) 60%, transparent); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.sm { width: 34px; height: 34px; font-size: 12px; }
.avatar.xl { width: 92px; height: 92px; font-size: 28px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--copper); }
.avatar-btn { display: none; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
.drawer.left { left: 0; right: auto; width: min(460px, 100%); border-left: 0; border-right: 1px solid var(--line); transform: translateX(-102%); padding-right: 0; padding-left: env(safe-area-inset-left, 0px); }
.drawer.left.on { transform: none; }
.pf-head { display: flex; gap: 16px; align-items: center; }
.pf-head .who { min-width: 0; }
.pf-head .who b { display: block; font-family: var(--display); font-size: var(--fs-lg); overflow-wrap: anywhere; }
.pf-head .who span { color: var(--ink-3); font-size: var(--fs-sm); }
.pf-sec { display: grid; gap: 12px; padding-top: 4px; }
.pf-sec > h4 { font-family: var(--display); font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); }
.pf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pf-grid .wide { grid-column: 1 / -1; }
.field input[type="email"], .field input[type="tel"] { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); width: 100%; min-width: 0; }
.theme-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; }
.theme-seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: var(--fs-sm); color: var(--ink-2); font-weight: 600; font-family: var(--display); }
.theme-seg button[aria-pressed="true"] { background: var(--chrome); color: var(--chrome-ink); }
.pf-note { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-xs); color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; }
.pf-note svg { width: 15px; height: 15px; flex: none; color: var(--copper); margin-top: 1px; }
.pf-foot { font-size: var(--fs-xs); color: var(--ink-3); text-align: center; }
details.pf-tools summary { cursor: pointer; font-size: var(--fs-sm); color: var(--copper-ink); font-weight: 600; }
details.pf-tools[open] summary { margin-bottom: 10px; }

/* ---------- gaveta: brilho que corre na borda ao abrir ---------- */
.drawer::before { content: ""; position: absolute; top: 0; left: -1px; width: 3px; height: 34%; background: linear-gradient(180deg, transparent, var(--copper-light), var(--copper), transparent); opacity: 0; pointer-events: none; z-index: 2; border-radius: 3px; }
.drawer.left::before { left: auto; right: -1px; }
.drawer.fx::before { animation: rf-edge 1.15s cubic-bezier(.25, .7, .2, 1) .12s both; }
.drawer.fx { animation: rf-edge-glow 1.3s ease-out .1s both; }
@keyframes rf-edge { 0% { transform: translateY(-100%); opacity: 1; } 82% { opacity: 1; } 100% { transform: translateY(300%); opacity: 0; } }
@keyframes rf-edge-glow { 0% { box-shadow: -1px 0 0 0 var(--copper), -8px 0 26px -6px color-mix(in srgb, var(--copper) 55%, transparent), var(--shadow); } 100% { box-shadow: -1px 0 0 0 transparent, -8px 0 26px -6px transparent, var(--shadow); } }
.drawer.left.fx { animation-name: rf-edge-glow-l; }
@keyframes rf-edge-glow-l { 0% { box-shadow: 1px 0 0 0 var(--copper), 8px 0 26px -6px color-mix(in srgb, var(--copper) 55%, transparent), var(--shadow); } 100% { box-shadow: 1px 0 0 0 transparent, 8px 0 26px -6px transparent, var(--shadow); } }

/* ---------- importar: arquivo anexado e linhas que acabaram de ser atualizadas ---------- */
.drop.got { animation: rf-got .9s cubic-bezier(.2, .7, .2, 1); }
@keyframes rf-got { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--copper) 50%, transparent); border-color: var(--copper); } 60% { box-shadow: 0 0 0 10px transparent; border-color: var(--copper); } 100% { box-shadow: 0 0 0 0 transparent; } }
.files-in { display: grid; gap: 8px; width: min(100%, 460px); }
.file-chip { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); animation: rf-chip-in .45s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
.file-chip .fc-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, #1D6F42 14%, transparent); color: #1D6F42; }
.file-chip .fc-ic svg { width: 18px; height: 18px; }
.file-chip .fc-n { font-size: var(--fs-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip .fc-s { font-size: var(--fs-xs); color: var(--ink-3); }
.file-chip .fc-ok { width: 22px; height: 22px; color: var(--credit); }
