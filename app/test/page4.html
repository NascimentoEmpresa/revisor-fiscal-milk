/* --- leitura do Excel: .xlsx em fluxo (rápido e com pouca memória); SheetJS para .xls/.csv ou se o fluxo falhar --- */
const NAO_ACHEI = f => 'Não encontrei as colunas da exportação do SistemaMA (CFOP, Vlr PIS…) em "' + f.name + '". Confira se é a consulta "EFD - Contribuições - 037 - Entradas" ou "047 - Saídas", Todos os Registros - Completo.';
async function readWorkbook(file, prog) {
  if (/\.xls[xm]$/i.test(file.name || '') || !file.name) {
    try {
      const r = await readXlsxStream(file, p => prog && prog(Math.round(p * 100) + '% lido'));
      if (!r) throw new Error(NAO_ACHEI(file));
      return r;
    } catch (e) {
      if (/Não encontrei/.test(e.message) || file.size > 40e6 || typeof XLSX === 'undefined') throw e;
      console.warn('leitura em fluxo falhou, usando SheetJS', e);
    }
  }
  if (typeof XLSX === 'undefined') throw new Error('A biblioteca de leitura de Excel não carregou. Verifique a conexão com a internet e recarregue a página.');
  const buf = await file.arrayBuffer();
  await tick();
  const wb = XLSX.read(buf, { type: 'array', dense: true, cellDates: true, cellNF: false, cellText: false, cellHTML: false });
  // a aba com mais linhas e com as colunas esperadas
  let best = null;
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: false });
    let hr = -1;
    for (let i = 0; i < Math.min(10, aoa.length); i++) {
      const ks = (aoa[i] || []).map(normKey);
      if (ks.includes('cfop') && ks.some(k => k === 'vlr pis')) { hr = i; break; }
    }
    if (hr >= 0 && (!best || aoa.length > best.aoa.length)) best = { name, aoa, hr };
  }
  if (!best) throw new Error(NAO_ACHEI(file));
  const headers = best.aoa[best.hr].map(h => h == null ? '' : String(h).trim());
  const rows = best.aoa.slice(best.hr + 1).filter(r => r && r.some(v => v != null && v !== ''));
  // remove uma eventual linha de totais no fim (AutoSoma)
  while (rows.length && !rows[rows.length - 1].slice(0, 3).some(v => v != null && v !== '')) rows.pop();
  return { headers, rows };
}

function mapHeaders(headers) {
  const hk = headers.map(normKey), map = {}, missing = [];
  for (const [key, def] of Object.entries(FIELDS)) {
    let idx = -1;
    for (const n of def.names) { idx = hk.indexOf(n); if (idx >= 0) break; }
    if (idx < 0 && def.prefix) idx = hk.findIndex(h => h.startsWith(def.prefix));
    if (idx >= 0) map[key] = idx; else if (def.req) missing.push(key);
  }
  return { hk, map, missing, hasAnoMes: hk[0] === 'ano' && hk[1] === 'mes' };
}
/* 037 (entradas) ou 047 (saídas): pelo cabeçalho e, na dúvida, pelo 1º dígito do CFOP */
/* 037 x 047: colunas que só uma das duas consultas tem (a 037 real também traz "Data Entrada/Saída", então ela não decide);
   sem elas, a maioria dos CFOP (1/2/3 = entradas, 5/6/7 = saídas) */
function detectTipo(hk, rows, map) {
  if (hk.includes('faturamento') || hk.includes('vlr seguro') || hk.includes('vlr outras da')) return 'SAI';
  if (hk.includes('deb cred') || hk.includes('natureza credito') || hk.includes('natureza base calculo credito') || hk.includes('nome contabil') || hk.includes('nome conta')) return 'ENT';
  let s = 0, e = 0;
  for (let i = 0; i < rows.length && i < 5000; i++) { const c = digits(rows[i][map.cfop]); if (/^[567]/.test(c)) s++; else if (/^[123]/.test(c)) e++; }
  return s > e ? 'SAI' : 'ENT';
}
const kbKey = g => MODE.kbPrefix + (g.ncm || '-') + '|' + (g.cfop || '-');

/* --- pipeline: cada etapa é medida e mostrada na tela --- */
async function runPipeline(input, onStep) {
  const T = [];
  const step = async (id, label, fn) => {
    onStep && onStep({ id, label, state: 'run' }); await tick();
    const prog = d => onStep && onStep({ id, label, state: 'run', detail: d });
    const t0 = now(); const detail = await fn(prog); const ms = now() - t0 + (id === 'ler' && input.pre && input.pre.ms || 0); // a leitura dos arquivos já separados conta aqui
    T.push({ id, label, ms, detail }); onStep && onStep({ id, label, state: 'ok', ms, detail }); await tick();
  };
  const t0 = now();
  let headers, rows, empresa = { nome: '', cnpj: '' }, fileNames = [];
  const demoTipo = input.demo ? (input.demo === 'SAI' ? 'SAI' : 'ENT') : null;

  await step('ler', 'Leitura do arquivo', async (prog) => {
    if (demoTipo) { const d = demoTipo === 'SAI' ? buildDemoSaidas() : buildDemo(); headers = d.headers; rows = d.rows; empresa = Object.assign({}, d.empresa); fileNames = [MODES[demoTipo].titulo + '.xlsx']; }
    else if (input.pre) { headers = input.pre.headers; rows = input.pre.rows; fileNames = input.pre.fileNames.slice(); } // já lidos (vários arquivos separados em 037 e 047)
    else {
      for (const f of input.files) {
        const wb = await readWorkbook(f, d => prog((input.files.length > 1 ? f.name + ': ' : '') + d));
        if (!headers) { headers = wb.headers; rows = wb.rows; }
        else {
          if (wb.headers.map(normKey).join('|') !== headers.map(normKey).join('|')) throw new Error('"' + f.name + '" tem colunas diferentes do primeiro arquivo. Importe juntos apenas arquivos da mesma consulta (ex.: a 037 dividida por ano); a 037 e a 047 são analisadas separadamente.');
          for (const r of wb.rows) rows.push(r);
        }
        fileNames.push(f.name);
      }
    }
    if (input.sample) empresa = Object.assign({}, DEMO_EMPRESA);
    return fNum(rows.length) + ' linhas · ' + headers.length + ' colunas' + (fileNames.length > 1 ? ' · ' + fileNames.length + ' arquivos unidos' : '');
  });

  let M;
  await step('map', 'Mapeamento das colunas', async () => {
    M = mapHeaders(headers);
    if (M.missing.length) throw new Error('Colunas obrigatórias não encontradas: ' + M.missing.map(k => FIELDS[k].names[0].toUpperCase()).join(', ') + '.');
    setMode(demoTipo || (input.pre && input.pre.tipo) || detectTipo(M.hk, rows, M.map));
    return 'Planilha ' + MODE.planilha + ' (' + MODE.nome + ') · ' + Object.keys(M.map).length + ' campos reconhecidos de ' + Object.keys(FIELDS).length + (M.hasAnoMes ? ' · ANO/MÊS já existiam' : '');
  });

  const recs = [];
  await step('anomes', 'Colunas ANO e MÊS', async () => {
    const m = M.map; let bad = 0;
    for (let i = 0; i < rows.length; i++) {
      const v = rows[i];
      const d = toDate(v[m.periodo]) || toDate(v[m.dataDoc]);
      if (!d) { bad++; continue; }
      const cst = digits(v[m.cstPis]).slice(0, 2), cstC = m.cstCof != null ? digits(v[m.cstCof]).slice(0, 2) : cst;
      recs.push({
        i, v, ano: d.y, mes: String(d.m).padStart(2, '0') + '/' + d.y, ym: d.y * 100 + d.m,
        registro: String(v[m.registro] || ''), cfop: digits(v[m.cfop]).slice(0, 4), ncm: digits(v[m.ncm], 8), desc: String(v[m.desc] || '').trim(),
        tipoItem: m.tipoItem != null ? String(v[m.tipoItem] || '') : '', part: m.part != null ? String(v[m.part] || '') : '',
        vlrItem: toNum(v[m.vlrItem]), vlrDesc: m.vlrDesc != null ? toNum(v[m.vlrDesc]) : 0, vlrIcms: m.vlrIcms != null ? toNum(v[m.vlrIcms]) : 0,
        cst, cstC, bcPis: toNum(v[m.bcPis]), aliqPis: toNum(v[m.aliqPis]), vlrPis: toNum(v[m.vlrPis]), aliqCof: toNum(v[m.aliqCof]), vlrCof: toNum(v[m.vlrCof]),
        g: null, ov: null
      });
    }
    if (!recs.length) throw new Error('Nenhuma linha com período válido. Confira a coluna "Período".');
    if (!empresa.cnpj && M.map.cnpj != null) empresa.cnpj = digits(rows[0][M.map.cnpj]);
    return fNum(recs.length) + ' linhas datadas' + (bad ? ' · ' + bad + ' sem período (ignoradas)' : '') + ' · ' + ymLabel(recs.reduce((a, r) => Math.min(a, r.ym), 999999)) + ' a ' + ymLabel(recs.reduce((a, r) => Math.max(a, r.ym), 0));
  });

  const tot = {};
  await step('tot', 'Totais e conferência', async () => {
    tot.n = recs.length; tot.vlrItem = 0; tot.bcPis = 0; tot.pis = 0; tot.cof = 0; tot.icms = 0;
    for (const r of recs) { tot.vlrItem += r.vlrItem; tot.bcPis += r.bcPis; tot.pis += r.vlrPis; tot.cof += r.vlrCof; tot.icms += r.vlrIcms; }
    return fBRL(tot.vlrItem) + ' em itens · PIS ' + fBRL(tot.pis) + ' · COFINS ' + fBRL(tot.cof);
  });

  const monthsMap = new Map(); const regMap = new Map();
  await step('din', 'Dinâmicas por registro e por mês', async () => {
    for (const r of recs) {
      let mo = monthsMap.get(r.ym);
      if (!mo) { mo = { ym: r.ym, ano: r.ano, mes: r.mes, n: 0, bcPis: 0, pis: 0, cof: 0, nc: 0, cum: 0, pot: 0, potBase: 0, contIcms: 0 }; monthsMap.set(r.ym, mo); }
      mo.n++; mo.bcPis += r.bcPis; mo.pis += r.vlrPis; mo.cof += r.vlrCof;
      if (r.vlrPis > 0 && Math.abs(r.aliqPis - 1.65) < .001) mo.nc++;
      if (r.vlrPis > 0 && Math.abs(r.aliqPis - .65) < .001 && !/^f150/i.test(r.registro)) mo.cum++;
      const rk = r.ano + '|' + r.registro;
      let rg = regMap.get(rk); if (!rg) { rg = { ano: r.ano, registro: r.registro, pis: 0, cof: 0, n: 0 }; regMap.set(rk, rg); }
      rg.pis += r.vlrPis; rg.cof += r.vlrCof; rg.n++;
    }
    return monthsMap.size + ' meses · ' + new Set([...regMap.values()].map(x => x.registro)).size + ' tipos de registro';
  });

  const months = [...monthsMap.values()].sort((a, b) => a.ym - b.ym);
  months.forEach(mo => { mo.regime = mo.nc > 0 ? 'NC' : (mo.cum > 0 ? 'CUM' : 'SEM'); });
  // mês sem nenhum crédito entre meses não cumulativos: segue o regime do ano
  const anoNC = new Set(months.filter(m => m.regime === 'NC').map(m => m.ano));
  months.forEach(mo => { if (mo.regime === 'SEM' && anoNC.has(mo.ano)) mo.regime = 'NC'; });
  const monthIdx = new Map(months.map(m => [m.ym, m]));

  let com = [], sem = [];
  await step('sep', 'Separação COM e SEM PIS/COFINS', async () => {
    // como no vídeo (13:44): filtro na coluna Vlr PIS; zerado ou vazio vai para NOTAS SEM PC
    for (const r of recs) (Math.abs(r.vlrPis) > .004 ? com : sem).push(r);
    const sC = com.reduce((a, r) => a + r.vlrItem, 0), sS = sem.reduce((a, r) => a + r.vlrItem, 0);
    tot.sepOk = (com.length + sem.length === recs.length) && Math.abs(sC + sS - tot.vlrItem) < .05;
    tot.comN = com.length; tot.semN = sem.length; tot.comV = sC; tot.semV = sS;
    return SAI() ? fNum(com.length) + ' vendas tributadas · ' + fNum(sem.length) + ' sem PIS/COFINS · soma ' + (tot.sepOk ? 'confere' : 'NÃO confere')
      : fNum(com.length) + ' com crédito · ' + fNum(sem.length) + ' sem crédito · soma ' + (tot.sepOk ? 'confere' : 'NÃO confere');
  });

  const groups = [];
  const alvo = SAI() ? com : sem;
  await step('cls', 'Pré-classificação por NCM + CFOP', async () => {
    const gm = new Map();
    // saídas: CSTs sem tributação já usados para o mesmo NCM em vendas (sinal de cadastro inconsistente)
    const semTrib = new Map();
    if (SAI()) for (const r of sem) { if (!r.ncm || !CST_NAO_TRIB.has(r.cst) || !CFOP_SAI_VENDA.has(r.cfop.slice(1))) continue; let st = semTrib.get(r.ncm); if (!st) semTrib.set(r.ncm, st = new Set()); st.add(r.cst); }
    for (const r of alvo) {
      const k = (r.ncm || '-') + '|' + (r.cfop || '-') + (r.cfop ? '' : '|' + normKey(r.desc).slice(0, 24)) + (!r.ncm && REG_CONSOLIDADO.test(r.registro) ? '|consolidado' : '');
      let g = gm.get(k);
      if (!g) { g = { key: k, ncm: r.ncm, cfop: r.cfop, registro: r.registro, tipoItem: r.tipoItem, recs: [], n: 0, vlr: 0, descs: new Map(), parts: new Map(), csts: new Map(), ncN: 0 }; gm.set(k, g); }
      g.recs.push(r); g.n++; g.vlr += r.vlrItem; r.g = g;
      g.descs.set(r.desc, (g.descs.get(r.desc) || 0) + 1);
      if (r.part) g.parts.set(r.part, (g.parts.get(r.part) || 0) + 1);
      g.csts.set(r.cst, (g.csts.get(r.cst) || 0) + 1);
      const mo = monthIdx.get(r.ym); if (mo && mo.regime === 'NC') g.ncN++;
    }
    for (const g of gm.values()) {
      g.descTop = [...g.descs.entries()].sort((a, b) => b[1] - a[1])[0][0];
      g.cstMain = [...g.csts.entries()].sort((a, b) => b[1] - a[1])[0][0];
      g.nc = g.ncN > 0;
      if (SAI()) g.semTribCst = g.ncm && semTrib.has(g.ncm) ? [...semTrib.get(g.ncm)].sort() : [];
      g.sug = (SAI() ? suggestSai : suggest)(g, S.kb); g.dec = null; g.learn = false;
      groups.push(g);
    }
    const rank = g => SAI() ? { COM: 0, AVA: 1, SEM: 2 }[CLS_KEY[g.sug.cls]] : 0; // saídas: o que pede ação aparece primeiro
    groups.sort((a, b) => rank(a) - rank(b) || b.vlr - a.vlr);
    const c = { COM: 0, SEM: 0, AVA: 0 }; groups.forEach(g => c[CLS_KEY[g.sug.cls]]++);
    return SAI() ? groups.length + ' grupos NCM + CFOP · ' + c.COM + ' para recuperar · ' + c.AVA + ' para avaliar · ' + c.SEM + ' corretos'
      : groups.length + ' grupos NCM + CFOP · ' + c.COM + ' com indício de crédito · ' + c.AVA + ' para avaliar · ' + c.SEM + ' sem crédito';
  });

  Object.assign(S, {
    loaded: true, demo: !!(input.demo || input.sample), tipo: MODE.id, files: fileNames, empresa, headers, hkey: M.hk, map: M.map, hasAnoMes: M.hasAnoMes,
    recs, com, sem, alvo, groups, months, monthIdx, totals: tot, regTable: [...regMap.values()].sort((a, b) => a.ano - b.ano || a.registro.localeCompare(b.registro))
  });
  await step('ck', 'Checklist automático', async () => {
    recompute();
    const att = S.checks.filter(c => c.st !== 'ok' && c.st !== 'info').length;
    return S.checks.length + ' verificações · ' + att + ' pedem atenção';
  });
  S.timings = T; S.procMs = now() - t0 + (input.pre && input.pre.ms || 0);
  return S;
}

/* --- classificação final e crédito potencial --- */
const clsOf = r => r.ov || (r.g ? (r.g.dec || r.g.sug.cls) : null);
function creditOf(r) {
  if (clsOf(r) !== CLS.COM) return null;
  if (S.tipo === 'SAI') return { base: r2(r.bcPis), pis: r2(r.vlrPis), cof: r2(r.vlrCof) }; // saída tributada indevidamente: o que foi pago
  const mo = S.monthIdx.get(r.ym);
  if (!mo || mo.regime !== 'NC') return null;
  const base = Math.max(0, r.vlrItem - r.vlrDesc - (S.settings.excluirIcms && r.ym >= 202305 ? r.vlrIcms : 0));
  return { base: r2(base), pis: r2(base * .0165), cof: r2(base * .076) };
}

function recompute() {
  S.months.forEach(m => { m.pot = 0; m.potBase = 0; m.potPis = 0; m.potCof = 0; });
  let pot = { base: 0, pis: 0, cof: 0, n: 0 };
  const byYear = new Map();
  for (const r of S.alvo) {
    const c = creditOf(r); if (!c) continue;
    const mo = S.monthIdx.get(r.ym); mo.pot += c.pis + c.cof; mo.potBase += c.base; mo.potPis += c.pis; mo.potCof += c.cof;
    pot.base += c.base; pot.pis += c.pis; pot.cof += c.cof; pot.n++;
    const y = byYear.get(r.ano) || { ano: r.ano, base: 0, pis: 0, cof: 0 }; y.base += c.base; y.pis += c.pis; y.cof += c.cof; byYear.set(r.ano, y);
  }
  S.pot = pot; S.potYears = [...byYear.values()].sort((a, b) => a.ano - b.ano);
  S.checks = runChecks();
  S.resumo = buildResumo();
  if (S.analyses && S.analyses[S.tipo] && S.analyses[S.tipo].snap.recs === S.recs) S.analyses[S.tipo].snap.resumo = S.resumo;
  const g = S.groups;
  S.clsCount = { COM: 0, SEM: 0, AVA: 0, revisados: 0, vlrRev: 0 };
  for (const x of g) { S.clsCount[CLS_KEY[x.dec || x.sug.cls]]++; if (x.dec) { S.clsCount.revisados++; S.clsCount.vlrRev += x.vlr; } }
}

/* --- checklist: as verificações que hoje dependem da memória do analista --- */

    acao: 'Confirmar o regime de cada ano no relatório (Simples, Presumido ou Real).',
    rel: 'No período analisado (' + per + '), ' + E + ' apurou o PIS e a COFINS no regime não cumulativo em ' + nc.length + ' de ' + S.months.length + ' meses, com alíquotas de 1,65% e 7,6%, o que permite o aproveitamento de créditos sobre aquisições nos termos das Leis 10.637/2002 e 10.833/2003.'
  });
  // 3. oportunidade: itens classificados com crédito
  const comGroups = S.groups.filter(g => (g.dec || g.sug.cls) === CLS.COM);
  const potT = S.pot.pis + S.pot.cof;
  add({

    acao: 'Revisar os grupos de confiança média e baixa na Classificação.',
    rel: 'O cruzamento das notas fiscais de entrada escrituradas na EFD-Contribuições identificou ' + fNum(S.pot.n) + ' itens adquiridos para revenda ou com direito a crédito que foram lançados sem o aproveitamento de PIS e COFINS. O crédito não aproveitado soma ' + fBRL(potT) + ' (PIS ' + fBRL(S.pot.pis) + ' e COFINS ' + fBRL(S.pot.cof) + '), em valores nominais, passível de recuperação administrativa.'
  });

  }
  const ciV = r2(ci.icms * .0925); S.icmsEnt = { n: ci.n, base: r2(ci.icms), pis: r2(ci.icms * .0165), cof: r2(ci.icms * .076), v: ciV };

  });
  // 5. crédito tomado em monofásico ou alíquota zero (revenda)

    txt: uc.n ? fNum(uc.n) + ' itens com CFOP de uso e consumo (x556/x407) escriturados com crédito de ' + fBRL(uc.v) + '.' : 'Nenhum crédito tomado sobre itens com CFOP de uso e consumo.',

  // 6. alíquota divergente

    const mo = S.monthIdx.get(r.ym); if (!mo || mo.regime !== 'NC') continue;

    acao: cstDiv.length ? 'Conferir o cadastro tributário dos itens: o crédito de uma das contribuições pode ter ficado de fora.' : 'Nada a fazer.', rel: ''

    rel: f150.length && f150m === 12 ? 'Em relação ao estoque de abertura, a empresa aproveitou corretamente o crédito presumido em doze parcelas mensais, iguais e sucessivas, a partir do ingresso no regime não cumulativo (Lei 10.637/2002, art. 11; Lei 10.833/2003, art. 12).' : ''
  });
  return out;
}

function setGroupCls(g, cls) {
  g.dec = cls;

}
function learnGroup(g) {

/* --- checklist das saídas (047): o que foi pago a maior e o que pode ter ficado sem recolher --- */

      : inc.n ? fNum(inc.n) + ' itens de venda com o ICMS dentro da base das contribuições (' + ymLabel(inc.mi) + ' a ' + ymLabel(inc.ma) + '). ICMS na base: ' + fBRL(inc.icms) + '; PIS/COFINS pagos a maior: ' + fBRL(inc.v) + '.' + (exc.n ? ' A exclusão já aparece em ' + fNum(exc.n) + ' itens (desde ' + ymLabel(exc.first) + ').' : '')
      : comIcms ? 'A empresa já exclui o ICMS destacado da base do PIS e da COFINS ' + desde + ' (' + fNum(exc.n) + ' itens com ICMS próprio conferidos).' : 'Nenhuma venda tributada com ICMS próprio destacado (vendas com ICMS-ST ou sem ICMS).',
    acao: residual ? 'Casos isolados e de valor irrelevante: conferir se convém incluir no pedido.' : inc.n ? 'Recalcular as contribuições dos meses afetados sem o ICMS e pedir a restituição ou compensação, observado o prazo de cinco anos.' : 'Nada a fazer.',
    rel: residual ? E + ' já exclui o ICMS destacado da base de cálculo do PIS e da COFINS nas vendas ' + desde + ', em conformidade com o Tema 69 do STF (RE 574.706/PR); foram encontrados apenas ' + fNum(inc.n) + ' itens isolados com o imposto na base, de valor irrelevante (' + fBRL(inc.v) + ').'
      : inc.n ? 'Em maio de 2021, o Supremo Tribunal Federal concluiu o julgamento do Tema 69 da repercussão geral (RE 574.706/PR) e firmou a tese de que o ICMS destacado nas notas fiscais não compõe a base de cálculo do PIS e da COFINS. Constatamos que ' + E + ' manteve o ICMS na base de cálculo das contribuições em ' + fNum(inc.n) + ' itens de venda entre ' + ymLong(inc.mi) + ' e ' + ymLong(inc.ma) + ', o que resultou no pagamento a maior de ' + fBRL(inc.v) + ', em valores nominais, passível de recuperação.'
      : comIcms ? E + ' já exclui o ICMS destacado da base de cálculo do PIS e da COFINS nas vendas ' + desde + ', em conformidade com o Tema 69 do STF (RE 574.706/PR).' : ''
  });
  // 5. alíquota diferente da do regime do mês
  const al = { n: 0, v: 0, ex: null };
  for (const r of S.com) {
    if (r.cst === '02' || r.cst === '03') continue;
    const mo = S.monthIdx.get(r.ym), exp = mo && (mo.regime === 'NC' ? [1.65, 7.6] : mo.regime === 'CUM' ? [.65, 3] : null); if (!exp) continue;
    if ((r.vlrPis > 0 && r.aliqPis > 0 && Math.abs(r.aliqPis - exp[0]) > .001) || (r.vlrCof > 0 && r.aliqCof > 0 && Math.abs(r.aliqCof - exp[1]) > .001)) { al.n++; al.v += r.bcPis; if (!al.ex) al.ex = r; }
  }
  const pct = n => String(n).replace('.', ',') + '%';
  add({
    id: 'aliquota', t: 'Alíquota diferente da do regime do mês', st: al.n ? 'warn' : 'ok', n: al.n, v: al.n ? r2(al.v) : null,
    txt: al.n ? fNum(al.n) + ' itens tributados com alíquota fora do regime do mês (ex.: ' + pct(al.ex.aliqPis) + ' e ' + pct(al.ex.aliqCof) + ' em ' + al.ex.mes + '), base de ' + fBRL(al.v) + '.' : 'Todas as alíquotas conferem com o regime de cada mês.',
    acao: al.n ? 'Conferir: alíquota menor que a do regime indica débito a menor (contingência); maior indica pagamento a maior.' : 'Nada a fazer.', rel: ''
  });
  // 6. CST PIS x COFINS
  const cstDiv = S.recs.filter(r => r.cst && r.cstC && r.cst !== r.cstC);
  add({
    id: 'cst', t: 'CST de PIS diferente do CST de COFINS', st: cstDiv.length ? 'warn' : 'ok', n: cstDiv.length, v: cstDiv.length ? r2(cstDiv.reduce((a, r) => a + r.vlrItem, 0)) : null,
    txt: cstDiv.length ? fNum(cstDiv.length) + ' itens com CST diferente entre as duas contribuições (ex.: PIS ' + cstDiv[0].cst + ' e COFINS ' + cstDiv[0].cstC + ').' : 'CSTs de PIS e COFINS coerentes em todos os itens.',
    acao: cstDiv.length ? 'Conferir o cadastro tributário dos itens.' : 'Nada a fazer.', rel: ''
  });
  // 7. mesmo NCM tributado em umas vendas e não em outras
  const tribN = new Map(), naoN = new Map(), descN = new Map();
  for (const r of S.com) if (r.ncm && venda(r)) { tribN.set(r.ncm, (tribN.get(r.ncm) || 0) + r.vlrItem); if (!descN.has(r.ncm)) descN.set(r.ncm, r.desc); }
  for (const r of S.sem) if (r.ncm && venda(r) && CST_NAO_TRIB.has(r.cst)) { naoN.set(r.ncm, (naoN.get(r.ncm) || 0) + r.vlrItem); if (!descN.has(r.ncm)) descN.set(r.ncm, r.desc); }
  const ambos = [...tribN.keys()].filter(n => naoN.has(n)).sort((a, b) => (tribN.get(b) + naoN.get(b)) - (tribN.get(a) + naoN.get(a)));
  add({
    id: 'ncm-misto', t: 'NCM tributado em umas vendas e sem tributação em outras', st: ambos.length ? 'warn' : 'ok', n: ambos.length, v: null,
    txt: ambos.length ? ambos.length + ' NCM com tratamento diferente no período: ' + ambos.slice(0, 4).map(n => fmtNCM(n) + ' ' + String(descN.get(n) || '').toLowerCase().slice(0, 36) + ' (tributado ' + fBRL(tribN.get(n)) + ' · sem tributação ' + fBRL(naoN.get(n)) + ')').join('; ') + (ambos.length > 4 ? '; …' : '.') : 'Cada NCM tem o mesmo tratamento em todas as vendas.',
    acao: ambos.length ? 'Definir a tributação correta de cada NCM: se for monofásico ou de alíquota zero, as vendas tributadas entram no valor a recuperar; se for tributado, as vendas sem PIS/COFINS são contingência.' : 'Nada a fazer.',
    rel: ''
  });
  // 8. vendas sem PIS/COFINS de NCM fora das regras (possível débito a menor)
  const sr = { n: 0, base: 0, v: 0, ncms: new Set() };
  for (const r of S.sem) {
    if (!venda(r) || !CST_NAO_TRIB.has(r.cst) || !r.ncm || ncmRule(r.ncm)) continue;
    const mo = S.monthIdx.get(r.ym), a = mo && mo.regime === 'CUM' ? .0365 : .0925;
    sr.n++; sr.base += r.vlrItem; sr.v += r.vlrItem * a; sr.ncms.add(r.ncm);
  }
  add({
    id: 'sem-trib', t: 'Vendas sem PIS/COFINS de produtos fora das regras de monofásico e alíquota zero', st: sr.n ? 'warn' : 'ok', n: sr.n, v: sr.n ? r2(sr.v) : null,
    txt: sr.n ? fNum(sr.n) + ' itens vendidos sem as contribuições (CST 04 a 09) em ' + sr.ncms.size + ' NCM que não constam nas regras do Revisor: base de ' + fBRL(sr.base) + '. Se forem produtos tributados, o débito não recolhido seria de cerca de ' + fBRL(sr.v) + '.' : 'Todas as vendas sem PIS/COFINS têm NCM com regra de monofásico ou alíquota zero.',
    acao: sr.n ? 'Conferir o enquadramento desses NCM (a lista de regras é um ponto de partida e não esgota a legislação).' : 'Nada a fazer.', rel: ''
  });
  // 9. vendas consolidadas (NFC-e/cupom) sem o produto: a revisão por NCM não alcança essas vendas
  const cons = S.com.filter(r => !r.ncm && REG_CONSOLIDADO.test(r.registro));
  if (cons.length) {
    const vc = cons.reduce((a, r) => a + r.vlrItem, 0), pc = T.comV ? vc / T.comV * 100 : 0;
    add({
      id: 'consolidadas', t: 'Vendas consolidadas sem o produto (NFC-e e cupom)', st: 'info', n: cons.length, v: r2(vc),
      txt: fNum(cons.length) + ' linhas de venda consolidada (' + [...new Set(cons.map(r => (r.registro.match(REG_CONSOLIDADO) || [''])[0].toUpperCase()))].join(', ') + '), ' + fBRL(vc) + ' (' + NUM.format(Math.round(pc)) + '% das vendas tributadas). O SPED não traz NCM nem descrição dessas vendas.',
      acao: 'Para estender a revisão de monofásicos e alíquota zero às vendas de balcão, pedir os XML das NFC-e ou o relatório de vendas por produto do sistema da empresa.',
      rel: 'As vendas registradas por NFC-e são escrituradas de forma consolidada na EFD-Contribuições (' + fBRL(vc) + ' no período), sem a identificação dos produtos. A análise destas vendas por NCM depende dos arquivos XML das notas, que podem ser solicitados para ampliar a revisão.'
    });
  }
  // 10. vendas tributadas sem NCM (fora as consolidadas)
  const semNcm = S.com.filter(r => !r.ncm && !/^a1/i.test(r.registro) && !REG_CONSOLIDADO.test(r.registro));
  add({
    id: 'ncm', t: 'Vendas tributadas sem NCM', st: semNcm.length ? 'warn' : 'ok', n: semNcm.length, v: semNcm.length ? r2(semNcm.reduce((a, r) => a + r.vlrItem, 0)) : null,
    txt: semNcm.length ? fNum(semNcm.length) + ' itens sem NCM: a classificação depende da descrição.' : 'Todos os itens de mercadoria têm NCM.',
    acao: semNcm.length ? 'Classificar pela descrição ou pedir o XML das notas.' : 'Nada a fazer.', rel: ''
  });
  return out;
}


/* --- resumo de cada análise para a minuta no modelo da Milk (fica guardado junto com a análise) --- */
function buildResumo() {
  const ck = Object.fromEntries(S.checks.map(c => [c.id, c]));
  const faixas = [];
  for (const m of S.months) { const f = faixas[faixas.length - 1]; if (f && f.reg === m.regime) { f.fim = m.ym; f.n++; } else faixas.push({ reg: m.regime, ini: m.ym, fim: m.ym, n: 1 }); }
  const anosReg = {};
  for (const m of S.months) { const a = anosReg[m.ano] || (anosReg[m.ano] = { NC: 0, CUM: 0, SEM: 0 }); a[m.regime]++; }
  const ult = [...S.months].reverse().find(m => m.regime !== 'SEM');
  const R = { tipo: S.tipo, cnpj: S.empresa.cnpj, ini: S.months[0].ym, fim: S.months[S.months.length - 1].ym, faixas, anosReg, regimeAtual: ult ? ult.regime : null, pot: { base: r2(S.pot.base), pis: r2(S.pot.pis), cof: r2(S.pot.cof) } };
  if (S.tipo === 'ENT') {
    const porNcm = new Map();
    for (const r of S.alvo) { const c = creditOf(r); if (!c) continue; const k = r.ncm || '-'; let x = porNcm.get(k); if (!x) porNcm.set(k, x = { ncm: r.ncm, desc: r.desc, base: 0, pis: 0, cof: 0, n: 0 }); x.base += c.base; x.pis += c.pis; x.cof += c.cof; x.n++; }
    R.ncms = [...porNcm.values()].sort((a, b) => (b.pis + b.cof) - (a.pis + a.cof));
    R.icmsCred = S.icmsEnt || null;
    R.usoConsumo = ck['uso-consumo'] ? ck['uso-consumo'].v || 0 : 0;
    R.estoque = ck.estoque ? { st: ck.estoque.st, n: ck.estoque.n, txt: ck.estoque.txt } : null;
  } else {
    const cat = { zero: { base: 0, pis: 0, cof: 0 }, outras: { base: 0, pis: 0, cof: 0 } };
    for (const r of S.alvo) { const c = creditOf(r); if (!c) continue; const g = r.g, k = !r.ov && !(g.dec && g.dec !== g.sug.cls) && /Alíquota zero|Monofásico/.test(g.sug.cat || '') ? 'zero' : 'outras'; cat[k].base += c.base; cat[k].pis += c.pis; cat[k].cof += c.cof; }
    R.aliqZero = cat.zero; R.outrasReceitas = cat.outras;
    // produtos de alíquota zero ou monofásicos vendidos com tributação (vão para o parágrafo de alíquota zero do diagnóstico)
    const zm = new Map();
    for (const g of S.groups) { if ((g.dec || g.sug.cls) !== CLS.COM || (g.dec && g.dec !== g.sug.cls) || !/Alíquota zero|Monofásico/.test(g.sug.cat || '') || !g.ncm) continue; const k = g.ncm, nr = ncmRule(g.ncm); const x = zm.get(k) || { ncm: g.ncm, nome: nr ? nr.nome : g.descTop, v: 0 }; x.v += g.vlr; zm.set(k, x); }
    R.zeroNcms = [...zm.values()].sort((a, b) => b.v - a.v);
    R.icms = S.icmsSai || null;
  }
  return R;
}

/* --- várias análises abertas ao mesmo tempo (a 037 e a 047 da mesma empresa) --- */
const SNAP_KEYS = ['loaded', 'demo', 'tipo', 'files', 'empresa', 'headers', 'hkey', 'map', 'hasAnoMes', 'recs', 'com', 'sem', 'alvo', 'groups', 'months', 'monthIdx', 'totals', 'regTable', 'timings', 'procMs', 'pot', 'potYears', 'checks', 'clsCount', 'resumo', 'icmsSai', 'icmsEnt'];
S.analyses = {};
function guardarAnalise() { if (!S.loaded) return; const snap = {}; for (const k of SNAP_KEYS) snap[k] = S[k]; S.analyses[S.tipo] = { snap }; }
function ativarAnalise(tipo) {
  const a = S.analyses[tipo]; if (!a) return false;
  guardarAnalise();
  Object.assign(S, a.snap); setMode(tipo); recompute();
  return true;
}
/* a outra análise só entra na minuta se for da mesma empresa (mesmo CNPJ) */
function resumoDe(tipo) {
  if (S.tipo === tipo) return S.resumo;
  const a = S.analyses[tipo]; if (!a || !a.snap.resumo) return null;
  return digits(a.snap.empresa.cnpj) === digits(S.empresa.cnpj) ? a.snap.resumo : null;
}

    this.names = headers.map((h, i) => { const b = String(h == null ? '' : h).trim() || 'Coluna ' + (i + 1); let n = b, k = 2; while (seen.has(n.toLowerCase())) n = b + (k++); seen.add(n.toLowerCase()); return n; });
    this.ref = 'A1:' + colName(headers.length - 1) + (recs.length + 1);
  }
  norm(v) { return this.blankEmpty && (v == null || v === '') ? '' : pvNorm(v); }
  distinct(fi) { const m = new Map(); for (const r of this.recs) { const v = this.norm(this.val(r, fi)), k = pvKey(v); if (!m.has(k)) m.set(k, v); } return [...m.values()]; }
  setAxis(fi, items) { const idx = new Map(); items.forEach((v, i) => idx.set(pvKey(v), i)); this.axis.set(fi, { items, idx }); }
  typeAttrs(vals, withCount) {
    let str = 0, num = 0, blank = 0, int = true, mn = Infinity, mx = -Infinity;
    for (const v of vals) { if (v == null) blank++; else if (typeof v === 'number') { num++; if (!Number.isInteger(v)) int = false; if (v < mn) mn = v; if (v > mx) mx = v; } else str++; }
    let a = '';
    if (num && !str) a = (blank ? '' : ' containsSemiMixedTypes="0"') + ' containsString="0"' + (blank ? ' containsBlank="1"' : '') + ' containsNumber="1"' + (int ? ' containsInteger="1"' : '') + ' minValue="' + mn + '" maxValue="' + mx + '"';
    else if (num && str) a = ' containsMixedTypes="1"' + (blank ? ' containsBlank="1"' : '') + ' containsNumber="1"' + (int ? ' containsInteger="1"' : '') + ' minValue="' + mn + '" maxValue="' + mx + '"';
    else if (blank) a = ' containsBlank="1"';
    return a + (withCount ? ' count="' + vals.length + '"' : '');
  }
  fieldXml(fi) {
    const nm = '<cacheField name="' + xmlEsc(this.names[fi]) + '" numFmtId="0">', ax = this.axis.get(fi);

    return nm + '<sharedItems/></cacheField>';
  }

    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><pivotCacheDefinition xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" saveData="0" refreshOnLoad="1" createdVersion="6" refreshedVersion="6" minRefreshableVersion="3" recordCount="' + this.recs.length + '">' +
      '<cacheSource type="worksheet"><worksheetSource ref="' + this.ref + '" sheet="' + xmlEsc(this.sheet) + '"/></cacheSource><cacheFields count="' + this.names.length + '">' +
      this.names.map((n, fi) => this.fieldXml(fi)).join('') + '</cacheFields></pivotCacheDefinition>';
  }
}

/* Tabela dinâmica no layout compacto (padrão do Excel): até 2 campos de linha, filtros de relatório e N valores (Soma).
   spec: { name, rows: [fi, fi?], page: [fi], data: [{ fi, name }], sortDesc, order: { fi: cmp }, note } */
function pivotSheet(cache, spec) {
  const R = spec.rows, P = spec.page || [], D = spec.data, val = cache.val;
  D.forEach(d => cache.data.add(d.fi));
  const top = new Map(), grand = D.map(() => 0);
  for (const rec of cache.recs) {
    const sums = D.map(d => { const v = val(rec, d.fi); return typeof v === 'number' && isFinite(v) ? v : 0; });
    const v1 = cache.norm(val(rec, R[0])), k1 = pvKey(v1);
    let a = top.get(k1); if (!a) top.set(k1, a = { v: v1, s: D.map(() => 0), kids: new Map() });
    for (let i = 0; i < sums.length; i++) { a.s[i] += sums[i]; grand[i] += sums[i]; }
    if (R.length > 1) {
      const v2 = cache.norm(val(rec, R[1])), k2 = pvKey(v2);
      let b = a.kids.get(k2); if (!b) a.kids.set(k2, b = { v: v2, s: D.map(() => 0) });
      for (let i = 0; i < sums.length; i++) b.s[i] += sums[i];
    }
  }
  for (const fi of R.concat(P)) {
    if (cache.axis.has(fi)) continue;
    let items = cache.distinct(fi);
    if (fi === R[0] && (spec.sortDesc || spec.sortAsc)) { const sb = spec.sortBy || 0, tot = v => { const a = top.get(pvKey(v)); return a ? a.s[sb] : -Infinity; }; items.sort((a, b) => spec.sortAsc ? tot(a) - tot(b) : tot(b) - tot(a)); } // empate: ordem em que aparece na aba (como o Excel)
    else items.sort((spec.order && spec.order[fi]) || pvCmp);
    cache.setAxis(fi, items);
  }
  const ax1 = cache.axis.get(R[0]), ax2 = R.length > 1 ? cache.axis.get(R[1]) : null;
  const lines = [];
  for (const a of [...top.values()].sort((p, q) => ax1.idx.get(pvKey(p.v)) - ax1.idx.get(pvKey(q.v)))) {
    lines.push({ lvl: 0, v: a.v, s: a.s, x: ax1.idx.get(pvKey(a.v)) });
    if (ax2) for (const b of [...a.kids.values()].sort((p, q) => ax2.idx.get(pvKey(p.v)) - ax2.idx.get(pvKey(q.v)))) lines.push({ lvl: 1, v: b.v, s: b.s, x: ax2.idx.get(pvKey(b.v)) });
  }
  lines.push({ grand: true, s: grand });
  const L = spec.top ? 1 : P.length ? P.length + 2 : 3, nD = D.length, nf = spec.numFmt || 164;
  const X = k => k ? '<x v="' + k + '"/>' : '<x/>';
  const xml = cacheId => {
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><pivotTableDefinition xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" name="' + xmlEsc(spec.name) + '" cacheId="' + cacheId + '" applyNumberFormats="0" applyBorderFormats="0" applyFontFormats="0" applyPatternFormats="0" applyAlignmentFormats="0" applyWidthHeightFormats="1" dataCaption="Valores" updatedVersion="6" minRefreshableVersion="3" useAutoFormatting="1" itemPrintTitles="1" createdVersion="6" indent="0" outline="1" outlineData="1" multipleFieldFilters="0">';
    x += '<location ref="A' + L + ':' + colName(nD) + (L + lines.length) + '" firstHeaderRow="' + (nD > 1 ? 0 : 1) + '" firstDataRow="1" firstDataCol="1"' + (P.length ? ' rowPageCount="' + P.length + '" colPageCount="1"' : '') + '/>';
    x += '<pivotFields count="' + cache.names.length + '">';
    for (let fi = 0; fi < cache.names.length; fi++) {
      const isRow = R.includes(fi), isPage = P.includes(fi);
      if (isRow || isPage) {
        const its = cache.axis.get(fi).items, srt = isRow && fi === R[0] && (spec.sortDesc || spec.sortAsc);
        x += '<pivotField axis="' + (isRow ? 'axisRow' : 'axisPage') + '" showAll="0"' + (srt ? ' sortType="' + (spec.sortAsc ? 'ascending' : 'descending') + '"' : '') + '><items count="' + (its.length + 1) + '">' + its.map((v, i) => '<item x="' + i + '"/>').join('') + '<item t="default"/></items>' +
          (srt ? '<autoSortScope><pivotArea dataOnly="0" outline="0" fieldPosition="0"><references count="1"><reference field="4294967294" count="1" selected="0"><x v="' + (spec.sortBy || 0) + '"/></reference></references></pivotArea></autoSortScope>' : '') + '</pivotField>';
      } else x += D.some(d => d.fi === fi) ? '<pivotField dataField="1" showAll="0"/>' : '<pivotField showAll="0"/>';
    }
    x += '</pivotFields><rowFields count="' + R.length + '">' + R.map(fi => '<field x="' + fi + '"/>').join('') + '</rowFields>';
    x += '<rowItems count="' + lines.length + '">' + lines.map(l => l.grand ? '<i t="grand"><x/></i>' : l.lvl ? '<i r="1">' + X(l.x) + '</i>' : '<i>' + X(l.x) + '</i>').join('') + '</rowItems>';
    x += nD > 1 ? '<colFields count="1"><field x="-2"/></colFields><colItems count="' + nD + '">' + D.map((d, i) => i ? '<i i="' + i + '"><x v="' + i + '"/></i>' : '<i><x/></i>').join('') + '</colItems>' : '<colItems count="1"><i/></colItems>';
    if (P.length) x += '<pageFields count="' + P.length + '">' + P.map(fi => '<pageField fld="' + fi + '" hier="-1"/>').join('') + '</pageFields>';
    x += '<dataFields count="' + nD + '">' + D.map(d => '<dataField name="' + xmlEsc(d.name) + '" fld="' + d.fi + '" baseField="0" baseItem="0" numFmtId="' + nf + '"/>').join('') + '</dataFields>';
    x += '<pivotTableStyleInfo name="PivotStyleLight16" showRowHeaders="1" showColHeaders="1" showRowStripes="0" showColStripes="0" showLastColumn="1"/>';
    x += '<extLst><ext uri="{962EF5D1-5CA2-4c93-8EF4-DBF5C05439D2}" xmlns:x14="http://schemas.microsoft.com/office/spreadsheetml/2009/9/main"><x14:pivotTableDefinition hideValuesRow="1" xmlns:xm="http://schemas.microsoft.com/office/excel/2006/main"/></ext></extLst></pivotTableDefinition>';
    return x;
  };
  const vS = nf === 165 ? XS.eBrl : XS.brl, tS = nf === 165 ? XS.eTotB : XS.brlTot;
  const rows = async (emit) => {
    if (!spec.top) {
      const noteCell = spec.note ? { v: spec.note, s: XS.note } : null;
      if (P.length) P.forEach((fi, i) => { const c = [{ v: cache.names[fi], s: XS.bold }, '(Tudo)']; if (i === 0 && noteCell) { c[nD + 2] = noteCell; } emit(c); });
      else emit(noteCell ? [noteCell] : []);
      emit([]);
    }
    emit([{ v: 'Rótulos de Linha', s: XS.bold }].concat(D.map(d => ({ v: d.name, s: XS.bold }))));
    for (const l of lines) {
      if (l.grand) { emit([{ v: 'Total Geral', s: XS.txtB }].concat(l.s.map(v => ({ v: r2(v), s: tS })))); continue; }
      const lab = l.v == null ? '(vazio)' : l.v, sub = ax2 && !l.lvl;
      emit([{ v: lab, s: l.lvl ? XS.ind : (sub ? XS.bold : 0) }].concat(l.s.map(v => ({ v: r2(v), s: sub ? XS.brlB : vS }))));
    }
  };
  return { rows, pivot: { cache, xml }, lines: lines.length };
}

/* ---------- monta a pasta de trabalho de trabalho da revisão ---------- */
async function buildWorkbook(onProgress) {
  const B = new XlsxBook(), sai = S.tipo === 'SAI';
  const H = S.headers, hk = S.hkey, off = S.hasAnoMes ? 0 : 2;
  const BASE = MODE.base, ALVO = MODE.alvo, OUTRA = MODE.outra, APUR = MODE.apurado;
  B.title = 'Revisão PIS/COFINS - ' + MODE.nome + ' - ' + (S.empresa.nome || fmtCNPJ(S.empresa.cnpj));
  // colunas da base: ano e mês (texto, como =TEXTO(Período;"aaaa") e =TEXTO(Período;"mm/aaaa")) + as originais, na ordem do SistemaMA
  const LY = LAYOUT[sai ? 'SAI' : 'ENT'];
  const baseCols = [];
  if (!S.hasAnoMes) { baseCols.push({ h: LY.ano, k: 'ano', type: 'txt', hl: LY.hl.includes('ano') }, { h: LY.mes, k: 'mes', type: 'txt', hl: LY.hl.includes('mes') }); }
  H.forEach((h, i) => {
    const k = hk[i];
    let type = 'gen';
    if (/^vlr /.test(k)) type = 'brl';
    else if (/^aliquota/.test(k) || /^qtde/.test(k)) type = 'dec';
    else if (/^data |^periodo$/.test(k)) type = 'date';
    else if (TEXT_COLS.includes(k)) type = 'txt';
    baseCols.push({ h: h || ('Coluna ' + (i + 1)), i, k, type, hl: LY.hl.includes(k), cur: LY.cur.includes(k), tot: LY.tot.includes(k) });
  });
  // formatação igual à da analista: bordas finas em todas as células, cabeçalho em negrito (todo em cinza na 047),
  // cinza só nas colunas-chave, Moeda nas colunas de valor; as demais no formato Geral
  const styleOf = c => c.cur ? (c.hl ? XS.eBrlHl : XS.eBrlB) : (c.hl ? XS.bGenHl : XS.bGen);
  const curCol = c => c.cur && (!LY.curCol || LY.curCol.includes(c.k)); // coluna inteira em Moeda (o cabeçalho vai junto)
  const headOf = c => LY.headHl ? (curCol(c) ? XS.eHeadBrl : XS.bHeadHl) : (c.hl ? XS.bHeadHl : XS.bHead);
  const fmtD = d => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
  // valor como veio da exportação (datas em texto dd/mm/aaaa, vazios como texto vazio); a análise usa o valor convertido
  const valOf = (rec, c) => {
    if (c.k === 'ano') return String(rec.ano); if (c.k === 'mes') return rec.mes;
    let v = rec.v[c.i];
    if (v == null) return null;
    if (c.type === 'brl' || c.type === 'dec') return typeof v === 'number' ? v : (v === '' ? null : toNum(v));
    if (c.type === 'date') return v instanceof Date ? fmtD(v) : typeof v === 'number' ? (() => { const d = new Date(Math.round((v - 25569) * 864e5)); return fmtD(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); })() : v;
    if (c.type === 'txt' && typeof v === 'number') { if (c.k === 'ncm') return digits(v, 8); if (c.k === 'cfop') return digits(v); return String(v); }
    return v;
  };
  const cellOf = (rec, c) => { const v = valOf(rec, c); return v == null || v === '' ? BLANK : v; };
  const colIdx = key => baseCols.findIndex(c => c.i === S.map[key]);
  const baseStyles = baseCols.map(styleOf), baseHead = baseCols.map(headOf);
  const N = S.recs.length;
  const totIdx = baseCols.map((c, i) => c.tot ? i : -1).filter(i => i >= 0);
  const per = ymLabel(S.months[0].ym) + ' a ' + ymLabel(S.months[S.months.length - 1].ym);
  const T_ = (ent, sa) => sai ? sa : ent;
  const fmtW = v => 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // largura das colunas em Moeda como o "auto ajuste" do Excel (as demais ficam no padrão, como no arquivo da equipe)
  const curWidth = (list, ci) => { let mx = 0, sum = 0; for (const rec of list) { const v = valOf(rec, baseCols[ci]); if (typeof v === 'number') { sum += v; if (Math.abs(v) > mx) mx = Math.abs(v); } } if (baseCols[ci].tot) mx = Math.max(mx, Math.abs(sum)); return Math.max(10.71, (LY.minW && LY.minW[baseCols[ci].k]) || 0, +(fmtW(mx).length - 0.57).toFixed(2)); };
  const baseW = baseCols.map((c, i) => c.cur ? curWidth(S.recs, i) : null); // as abas NOTAS são cópias da base: mesmas larguras

  // ---------- abas de dados (BASE, NOTAS COM PC, NOTAS SEM PC) ----------
  const lastCol = colName(baseCols.length - 1);
  const dataSheet = (name, list, comTotal) => {
    const n = list.length, cols = baseW;
    return {
      name, grid: false, cols, colStyles: baseCols.map(c => curCol(c) ? XS.eBrl : 0), split: true, filterRef: 'A1:' + lastCol + (n + (comTotal ? 2 : 1)), landscape: true,
      rows: async (emit, yieldp) => {
        emit(baseCols.map(c => c.h), { s: baseHead });
        for (let k = 0; k < n; k++) {
          emit(baseCols.map(c => cellOf(list[k], c)), { s: baseStyles });
          if (k % 4000 === 3999) await yieldp(Math.round(k / n * 100));
        }
        if (!comTotal) return;
        // AutoSoma logo abaixo da última linha, nas colunas de valor (como a analista: =SOMA(X1:Xn), a primeira sem borda)
        const tot = [];
        totIdx.forEach((ci, j) => {
          let sum = 0; for (const rec of list) { const v = valOf(rec, baseCols[ci]); if (typeof v === 'number') sum += v; }
          tot[ci] = { v: r2(sum), f: n > XL_DADOS ? null : 'SUM(' + colName(ci) + '1:' + colName(ci) + (n + 1) + ')', s: j ? XS.eHeadBrl : XS.eTotHl };
        });
        if (LY.headHl && totIdx.length > 2) for (let ci = totIdx[1] + 1; ci < totIdx[totIdx.length - 1]; ci++) if (!tot[ci]) tot[ci] = { e: 1, s: XS.eTotB };
        emit(tot);
      }
    };
  };

  // ---------- aba classificada: CLASSIF. ao lado do NCM ----------
  // ENT: é a própria NOTAS SEM PC (como no vídeo). SAI: a NOTAS COM PC fica igual à da analista e a classificação vai para a
  // aba extra ITENS A RECUPERAR, só com as vendas marcadas RECUPERAR ou AVALIAR (as CORRETO ficam de fora).
  const ncmPos = colIdx('ncm');
  const semCols = baseCols.slice(0, ncmPos + 1).concat([{ h: 'CLASSIF.', k: 'cls', type: 'cls' }], baseCols.slice(ncmPos + 1));
  const extra = sai ? ['MOTIVO', 'FUNDAMENTO', 'CONFIANÇA', 'ORIGEM DA REGRA', 'REGIME DO MÊS', 'BASE A RECUPERAR', 'PIS A RECUPERAR', 'COFINS A RECUPERAR', 'LINHA NA ABA NOTAS COM PC']
    : ['MOTIVO', 'FUNDAMENTO', 'CONFIANÇA', 'ORIGEM DA REGRA', 'REGIME DO MÊS', 'BASE DO CRÉDITO', 'PIS POTENCIAL', 'COFINS POTENCIAL'];
  const SL = key => colName(semCols.findIndex(c => c.i === S.map[key]));
  const cCls = colName(ncmPos + 1), cReg = colName(semCols.length + 4), cBase = colName(semCols.length + 5), cPis = colName(semCols.length + 6), cCof = colName(semCols.length + 7);
  const mesPos = semCols.findIndex(c => c.k === 'mes'), cMes = mesPos >= 0 ? colName(mesPos) : null;
  const cPer = S.map.periodo != null ? SL('periodo') : null, cItem = SL('vlrItem'), cDesc = S.map.vlrDesc != null ? SL('vlrDesc') : null, cIcms = S.map.vlrIcms != null ? SL('vlrIcms') : null;
  const CLSHEET = sai ? 'ITENS A RECUPERAR' : ALVO;
  const linhaCom = sai ? new Map(S.alvo.map((r, k) => [r, k < XL_DADOS ? k + 2 : (k % XL_DADOS + 2) + ' (aba ' + (Math.floor(k / XL_DADOS) + 1) + ')'])) : null;
  const alvo = sai ? S.alvo.filter(r => clsOf(r) !== CLS.SEM) : S.alvo, aN = alvo.length;
  const semStyles = semCols.map(c => c.type === 'cls' ? XS.bGen : styleOf(c)).concat([XS.bWrap, XS.bWrap, XS.bGen, XS.bGen, XS.bGen, XS.eBrlB, XS.eBrlB, XS.eBrlB, XS.bGen]);
  const semHead = semCols.map(c => c.type === 'cls' ? (LY.headHl ? XS.bHeadHl : XS.bHead) : headOf(c)).concat(extra.map(() => LY.headHl ? XS.bHeadHl : XS.bHead));
  const semTot = semCols.map((c, i) => c.tot ? i : -1).filter(i => i >= 0);
  const regTxt = mo => !mo ? '' : mo.regime === 'NC' ? 'NÃO CUMULATIVO' : sai ? (mo.regime === 'CUM' ? 'CUMULATIVO' : 'SEM DÉBITO') : 'SEM APURAÇÃO NC';
  // a partir de 05/2023 (Lei 14.592/2023), pela coluna mês (texto mm/aaaa: vale para o Excel em qualquer idioma)
  const desde0523 = row => cMes ? '(VALUE(RIGHT(' + cMes + row + ',4))*100+VALUE(LEFT(' + cMes + row + ',2)))>=202305' : 'DATEVALUE(' + cPer + row + ')>=DATE(2023,5,1)';
  const semColW = semCols.map(c => c.type === 'cls' ? 16 : c.cur ? baseW[baseCols.indexOf(c)] : null).concat([46, 40, 11, 14, 16, 15, 14, 15].concat(sai ? [12] : []));
  const lastSem = colName(semCols.length + extra.length - 1);
  const alvoSheet = {
    name: CLSHEET, grid: false, cols: semColW, colStyles: semCols.map(c => c.type !== 'cls' && curCol(c) ? XS.eBrl : 0),
    split: true, tab: sai ? 'FF9E6846' : null, freeze: sai ? { row: 1 } : null, filterRef: 'A1:' + lastSem + (aN + 2), landscape: true,
    dv: aN ? [{ sqref: cCls + '2:' + cCls + (aN + 1), list: [CLS.COM, CLS.SEM, CLS.AVA] }] : [],
    rows: async (emit, yieldp) => {
      emit(semCols.map(c => c.h).concat(extra), { s: semHead });
      for (let k = 0; k < aN; k++) {
        const rec = alvo[k], row = emit.proxima(), cls = clsOf(rec), g = rec.g, mo = S.monthIdx.get(rec.ym), c = creditOf(rec);
        const cells = semCols.map(col => col.type === 'cls' ? cls : cellOf(rec, col));
        const sug = g.sug, by = rec.ov || g.dec ? (cls === sug.cls ? sug : null) : sug;
        let fB, fP, fC;
        if (sai) {
          const ok = cCls + row + '="' + CLS.COM + '"';
          fB = 'IF(' + ok + ',' + SL('bcPis') + row + ',0)'; fP = 'IF(' + ok + ',' + SL('vlrPis') + row + ',0)'; fC = 'IF(' + ok + ',' + SL('vlrCof') + row + ',0)';
        } else {
          fB = 'IF(AND(' + cCls + row + '="' + CLS.COM + '",' + cReg + row + '="NÃO CUMULATIVO"),MAX(0,N(' + cItem + row + ')' + (cDesc ? '-N(' + cDesc + row + ')' : '') + (cIcms && (cMes || cPer) ? '-IF(AND(ExcluirICMS,' + desde0523(row) + '),N(' + cIcms + row + '),0)' : '') + '),0)';
          fP = 'ROUND(' + cBase + row + '*1.65%,2)'; fC = 'ROUND(' + cBase + row + '*7.6%,2)';
        }
        cells.push(by ? by.motivo : 'Decisão do analista', by ? by.lei : '', by ? CONF[by.conf] : '—', rec.ov || g.dec ? 'Analista' : sug.origem, regTxt(mo),
          { v: c ? c.base : 0, f: fB }, { v: c ? c.pis : 0, f: fP }, { v: c ? c.cof : 0, f: fC });
        if (sai) cells.push(linhaCom.get(rec) || '');
        emit(cells, { s: semStyles });
        if (k % 4000 === 3999) await yieldp(Math.round(k / aN * 100));
      }
      const tot = [];
      semTot.forEach((ci, j) => { let sum = 0; for (const rec of alvo) { const v = valOf(rec, semCols[ci]); if (typeof v === 'number') sum += v; } tot[ci] = { v: r2(sum), f: aN > XL_DADOS ? null : 'SUM(' + colName(ci) + '1:' + colName(ci) + (aN + 1) + ')', s: j ? XS.eHeadBrl : XS.eTotHl }; });
      for (let key = 0; key < 3; key++) { const ci = semCols.length + 5 + key; let sum = 0; for (const rec of alvo) { const c = creditOf(rec); if (c) sum += [c.base, c.pis, c.cof][key]; } tot[ci] = { v: r2(sum), f: aN > XL_DADOS ? null : 'SUM(' + colName(ci) + '2:' + colName(ci) + (aN + 1) + ')', s: XS.eHeadBrl }; }
      emit(tot);
    }
  };

  // ---------- tabelas dinâmicas ----------
  const fA = baseCols.findIndex(c => c.k === 'ano'), fM = baseCols.findIndex(c => c.k === 'mes');
  const fReg = colIdx('registro'), fBc = colIdx('bcPis'), fPis = colIdx('vlrPis'), fCof = colIdx('vlrCof');
  const heads = baseCols.map(c => c.h), bval = (rec, fi) => valOf(rec, baseCols[fi]);
  // Base acima do limite do Excel: cada parte ("NOME (2)"…) ganha as mesmas tabelas dinâmicas da parte 1, sobre os dados
  // dela, com um aviso embaixo. Com uma parte só, tudo fica exatamente como antes (mesmos nomes e caches).
  const fatias = (nome, list) => { const q = Math.max(1, Math.ceil(list.length / XL_DADOS)); return partesDe(nome, list.length).map((pt, k) => ({ nome: pt.nome, k: k + 1, q, recs: q > 1 ? list.slice(k * XL_DADOS, k * XL_DADOS + pt.linhas) : list })); };
  const comAviso = (sh, f, nome, n) => {
    if (f.q < 2) return sh;
    const txt = 'Atenção: parte ' + f.k + ' de ' + f.q + '. Esta tabela dinâmica usa só os dados da aba "' + f.nome + '". A aba ' + nome + ' tem ' + fNum(n) + ' linhas e foi dividida em ' + f.q + ' abas porque o Excel aceita no máximo 1.048.576 linhas por aba. Some as partes para o total geral.';
    const orig = sh.rows; return Object.assign({}, sh, { rows: async (emit, y) => { await orig(emit, y); emit([]); emit([{ v: txt, s: XS.note }]); } });
  };
  const dat3 = [{ fi: fBc, name: 'Soma de Vlr Base Cálculo PIS' }, { fi: fPis, name: 'Soma de Vlr PIS' }, { fi: fCof, name: 'Soma de Vlr Cofins' }];
  const pivTab = (name, p, colA) => ({ name, grid: false, cols: [colA, 26.71, 14.86, 17.86], colStyles: [0, XS.eBrl, XS.eBrl, XS.eBrl], rows: p.rows, pivot: p.pivot });
  const larg = (list, fi) => { let mx = 16; for (const v of list) mx = Math.max(mx, String(v == null ? '' : v).length); return Math.min(80, Math.max(18, +(mx * 0.945).toFixed(2))); };

  B.addSheet(dataSheet(BASE, S.recs, LY.totSheets.includes('base')));
  if (sai) {
    // 047: as abas e dinâmicas do Excel final da analista, na mesma ordem
    const fMod = baseCols.findIndex(c => c.k === 'modelo'), fCfop = colIdx('cfop');
    let nT = 0; const nomeT = () => 'Tabela dinâmica' + (++nT);
    for (const f of fatias(BASE, S.recs)) {
      const pcBase = new PivotCache(f.nome, heads, f.recs, bval, { blankEmpty: true }), av = sh => comAviso(sh, f, BASE, S.recs.length);
      const pR = pivotSheet(pcBase, { name: nomeT(), top: true, rows: [fReg], data: dat3, numFmt: 165 });
      B.addSheet(av(pivTab(parteNome('REGISTRO', f.k), pR, larg(pcBase.distinct(fReg), fReg))));
      if (fMod >= 0) { const pM = pivotSheet(pcBase, { name: nomeT(), top: true, rows: [fMod], data: dat3, numFmt: 165 }); B.addSheet(av(pivTab(parteNome('MODELO', f.k), pM, 18))); }
      const pC = pivotSheet(pcBase, { name: nomeT(), top: true, rows: [fCfop], data: dat3, numFmt: 165 }); B.addSheet(av(pivTab(parteNome('CFOP', f.k), pC, 18)));
    }
    if (S.com.length) for (const f of fatias(ALVO, S.com)) {
      const pcCom = new PivotCache(f.nome, heads, f.recs, bval, { blankEmpty: true });
      const p = pivotSheet(pcCom, { name: nomeT(), top: true, rows: [ncmPos], data: dat3, numFmt: 165, sortAsc: true, sortBy: 1 });
      B.addSheet(comAviso({ ...pivTab(parteNome('DIN NCM COM PC - ORDEM CRESCENT', f.k), p, 18), colStyles: null }, f, ALVO, S.com.length));
    }
    B.addSheet(dataSheet(ALVO, S.com, LY.totSheets.includes('com')));
    B.addSheet(dataSheet(OUTRA, S.sem, LY.totSheets.includes('sem')));
    if (S.sem.length) for (const f of fatias(OUTRA, S.sem)) {
      const pcSem = new PivotCache(f.nome, heads, f.recs, bval, { blankEmpty: true });
      const p = pivotSheet(pcSem, { name: nomeT(), top: true, rows: [ncmPos], data: dat3, numFmt: 165 });
      B.addSheet(comAviso(pivTab(parteNome('DIN NCM SEM PC', f.k), p, 18), f, OUTRA, S.sem.length));
    }
  } else {
    // 037: como no vídeo 2 (DINAMICA POR REG, DINAM POR BC PC, NOTAS COM PC, DINAMICA POR NCM sobre a NOTAS SEM PC classificada)
    for (const f of fatias(BASE, S.recs)) {
      const pcBase = new PivotCache(f.nome, heads, f.recs, bval, { blankEmpty: true }), av = sh => comAviso(sh, f, BASE, S.recs.length);
      const pReg = pivotSheet(pcBase, { name: 'DinamicaPorReg', rows: fA >= 0 ? [fA, fReg] : [fReg], data: [{ fi: fPis, name: 'Soma de Vlr PIS' }, { fi: fCof, name: 'Soma de Vlr Cofins' }] });
      const pMes = pivotSheet(pcBase, { name: 'DinamicaPorBC', rows: fA >= 0 && fM >= 0 ? [fA, fM] : [fM >= 0 ? fM : fReg], data: dat3, order: { [fM]: pvCmpMes } });
      B.addSheet(av({ name: parteNome('DINAMICA POR REG', f.k), grid: false, cols: [58, 20, 20], rows: pReg.rows, pivot: pReg.pivot }));
      B.addSheet(av({ name: parteNome('DINAM POR BC PC', f.k), grid: false, cols: [20, 30, 20, 20], rows: pMes.rows, pivot: pMes.pivot }));
    }
    const nSem = semCols.length;
    const alvoVal = (rec, fi) => {
      if (fi < nSem) { const col = semCols[fi]; return col.type === 'cls' ? clsOf(rec) : valOf(rec, col); }
      const k = fi - nSem; if (k < 5) return null;
      const c = creditOf(rec); return c ? [c.base, c.pis, c.cof][k - 5] : 0;
    };
    const fItemA = semCols.findIndex(c => c.i === S.map.vlrItem);
    B.addSheet(dataSheet(OUTRA, S.com, LY.totSheets.includes('com')));
    if (aN) for (const f of fatias(ALVO, alvo)) {
      const cAlvo = new PivotCache(f.nome, semCols.map(c => c.h).concat(extra), f.recs, alvoVal, { blankEmpty: true });
      const pNcm = pivotSheet(cAlvo, { name: 'DinamicaPorNCM', rows: [ncmPos], sortAsc: true, data: [{ fi: fItemA, name: 'Soma de Vlr Item' }] });
      B.addSheet(comAviso({ name: parteNome('DINAMICA POR NCM', f.k), grid: false, cols: [20, 20], rows: pNcm.rows, pivot: pNcm.pivot }, f, ALVO, aN));
    }
    B.addSheet(alvoSheet);
  }

  // ---------- RESUMO (extra do Revisor) ----------
  const potT = S.pot.pis + S.pot.cof;
  const caTot = 4 + S.months.length + new Set(S.months.map(m => m.ano)).size;
  const AQ = "'" + APUR + "'!";
  B.addSheet({
    name: 'RESUMO', tab: 'FF111111', grid: false, cols: [4, 64, 22, 22, 22, 22, 60],
    rows: async (emit) => {
      emit([null, { v: 'Revisão PIS/COFINS (' + MODE.nome.toLowerCase() + ') — ' + (S.empresa.nome || 'Empresa'), s: XS.title }], { ht: 26 });
      emit([null, { v: 'CNPJ ' + fmtCNPJ(S.empresa.cnpj) + ' · período ' + per + ' · gerado pelo Revisor Fiscal em ' + new Date().toLocaleString('pt-BR'), s: XS.note }]);
      emit([null, { v: 'Fonte: ' + S.files.join(', ') + (abasDivididas().length ? ' · ATENÇÃO: ' + avisoDivisao() : ''), s: XS.note }]);
      emit([]);
      emit([null, 'Indicador', 'Valor'], { s: [0, XS.headG, XS.headG] });
      emit([null, 'Linhas processadas', { v: S.totals.n, s: XS.int }]);
      emit([null, T_('Total de itens de entrada (Vlr Item)', 'Total das saídas (Vlr Item)'), { v: r2(S.totals.vlrItem), s: XS.brl }]);
      emit([null, T_('Crédito escriturado — PIS', 'Débito escriturado — PIS'), { v: r2(S.totals.pis), s: XS.brl }]);
      emit([null, T_('Crédito escriturado — COFINS', 'Débito escriturado — COFINS'), { v: r2(S.totals.cof), s: XS.brl }]);
      emit([null, T_('Itens com crédito (aba NOTAS COM PC)', 'Vendas tributadas (aba NOTAS COM PC)'), { v: S.totals.comN, s: XS.int }]);
      emit([null, T_('Itens sem crédito (aba NOTAS SEM PC)', 'Saídas sem PIS/COFINS (aba NOTAS SEM PC)'), { v: S.totals.semN, s: XS.int }]);
      emit([null, T_('Crédito potencial — PIS', 'Valor a recuperar — PIS'), { v: r2(S.pot.pis), f: AQ + 'D' + caTot, s: XS.brlB }]);
      emit([null, T_('Crédito potencial — COFINS', 'Valor a recuperar — COFINS'), { v: r2(S.pot.cof), f: AQ + 'E' + caTot, s: XS.brlB }]);
      emit([null, T_('Crédito potencial — total', 'Valor a recuperar — total'), { v: r2(potT), f: 'C12+C13', s: XS.brlB }]);
      if (!sai) {
        const exRow = emit([null, 'Excluir ICMS da base do crédito a partir de 05/2023 (Lei 14.592/2023)', { v: !!S.settings.excluirIcms, s: XS.bold }]);
        B.names.push({ name: 'ExcluirICMS', ref: 'RESUMO!$C$' + exRow });
        emit([null, { v: 'Altere para VERDADEIRO/FALSO: a aba CRÉDITO APURADO recalcula. Na aba NOTAS SEM PC, mude a coluna CLASSIF. e o crédito se atualiza.', s: XS.note }]);
      } else emit([null, { v: 'Na aba ITENS A RECUPERAR (vendas marcadas RECUPERAR ou AVALIAR), mude a coluna CLASSIF. e a aba VALOR A RECUPERAR se atualiza.', s: XS.note }]);
      emit([]);
      const hy = [0, XS.headG, XS.headG, XS.headG, XS.headG, XS.headG];
      emit([null, T_('Crédito potencial por ano', 'Valor a recuperar por ano'), T_('Base do crédito', 'Base tributada indevidamente'), T_('PIS (1,65%)', 'PIS'), T_('COFINS (7,6%)', 'COFINS'), 'Total'], { s: hy });
      for (const y of S.potYears) emit([null, { v: y.ano, s: XS.def }, { v: r2(y.base), s: XS.brl }, { v: r2(y.pis), s: XS.brl }, { v: r2(y.cof), s: XS.brl }, { v: r2(y.pis + y.cof), s: XS.brlB }]);
      if (!S.potYears.length) emit([null, { v: 'Nenhum valor no período.', s: XS.note }]);
      emit([]);
      emit([null, 'Checklist', 'Situação', 'Itens', 'Valor (R$)', null, 'O que fazer'], { s: [0, XS.headG, XS.headG, XS.headG, XS.headG, XS.headG, XS.headG] });
      const stTxt = { ok: 'OK', opp: 'OPORTUNIDADE', risk: 'RISCO', warn: 'ATENÇÃO', info: 'INFORMATIVO' };
      for (const c of S.checks) emit([null, c.t, stTxt[c.st], { v: c.n, s: XS.int }, c.v != null ? { v: c.v, s: XS.brl } : null, null, { v: c.acao, s: XS.wrap }]);
      emit([]);
      emit([null, { v: 'Classificações sugeridas por regras automáticas. Revisão final do analista responsável. Valores nominais, sem atualização pela Selic.', s: XS.note }]);
    }
  });

  // ---------- CRÉDITO APURADO / VALOR A RECUPERAR (extra: fórmulas vivas sobre a aba classificada) ----------
  const SS = "'" + CLSHEET + "'!";
  const sr = col => SS + '$' + col + '$2:$' + col + '$' + (Math.max(aN, 1) + 1);
  if (sai) B.addSheet(alvoSheet);
  B.addSheet({
    name: APUR, tab: 'FF1C7A55', cols: [10, 12, 24, 18, 18, 20], freeze: { row: 3 },
    rows: async (emit) => {
      emit([{ v: T_('Crédito de PIS/COFINS não aproveitado, por mês', 'PIS/COFINS pagos a maior nas vendas, por mês'), s: XS.title }], { ht: 24 });
      emit([{ v: T_('Soma dos itens com CLASSIF. = ' + CLS.COM + ' na aba NOTAS SEM PC. Muda sozinho quando a classificação muda.', 'Soma das vendas com CLASSIF. = RECUPERAR na aba ITENS A RECUPERAR. Muda sozinho quando a classificação muda.'), s: XS.note }]);
      emit(['ANO', 'MÊS', T_('Base do crédito', 'Base tributada indevidamente'), T_('PIS (1,65%)', 'PIS a recuperar'), T_('COFINS (7,6%)', 'COFINS a recuperar'), 'Total'], { s: XS.head });
      const anos = [...new Set(S.months.map(m => m.ano))];
      let first = 4;
      for (const a of anos) {
        const ms = S.months.filter(m => m.ano === a);
        const r0 = first;
        for (const m of ms) {
          const row = first++;
          const soma = col => partesDe(CLSHEET, Math.max(aN, 1)).map(pt => { const q = "'" + pt.nome + "'!", fx = c => q + '$' + c + '$2:$' + c + '$' + (pt.linhas + 1); return 'SUMIFS(' + fx(col) + ',' + fx(cMes || 'B') + ',"' + m.mes + '")'; }).join('+');
          const pb = m.potBase, pp = r2(m.potPis), pc = r2(m.potCof);
          const anoCol = cMes;
          emit([{ v: a, s: XS.def }, m.mes,
            { v: r2(pb), f: anoCol ? soma(cBase) : null, s: XS.brl },
            { v: pp, f: anoCol ? soma(cPis) : null, s: XS.brl },
            { v: pc, f: anoCol ? soma(cCof) : null, s: XS.brl },
            { v: r2(pp + pc), f: 'D' + row + '+E' + row, s: XS.brlB }]);
        }
        const row = first++;
        const y = S.potYears.find(x => x.ano === a) || { base: 0, pis: 0, cof: 0 };
        emit([{ v: a, s: XS.bold }, { v: 'Total ' + a, s: XS.bold }, { v: r2(y.base), f: 'SUM(C' + r0 + ':C' + (row - 1) + ')', s: XS.brlB }, { v: r2(y.pis), f: 'SUM(D' + r0 + ':D' + (row - 1) + ')', s: XS.brlB }, { v: r2(y.cof), f: 'SUM(E' + r0 + ':E' + (row - 1) + ')', s: XS.brlB }, { v: r2(y.pis + y.cof), f: 'SUM(F' + r0 + ':F' + (row - 1) + ')', s: XS.brlB }]);
      }
      const row = first;
      emit([{ v: 'Total geral', s: XS.txtB }, { v: '', s: XS.txtB }, { v: r2(S.pot.base), f: 'SUMIFS(C4:C' + (row - 1) + ',B4:B' + (row - 1) + ',"Total*")', s: XS.brlTot }, { v: r2(S.pot.pis), f: 'SUMIFS(D4:D' + (row - 1) + ',B4:B' + (row - 1) + ',"Total*")', s: XS.brlTot }, { v: r2(S.pot.cof), f: 'SUMIFS(E4:E' + (row - 1) + ',B4:B' + (row - 1) + ',"Total*")', s: XS.brlTot }, { v: r2(S.pot.pis + S.pot.cof), f: 'SUMIFS(F4:F' + (row - 1) + ',B4:B' + (row - 1) + ',"Total*")', s: XS.brlTot }]);
    }
  });

  // ---------- RESUMO NCM (extra: ranking com o motivo da classificação) ----------
  B.addSheet({
    name: 'RESUMO NCM', tab: 'FF9E6846', cols: [12, 8, 44, 34, 9, 16, 16, 52, 40], freeze: { row: 3 }, filterRef: 'A3:I' + (S.groups.length + 3),
    rows: async (emit) => {
      emit([{ v: T_('Itens sem crédito agrupados por NCM e CFOP, do maior para o menor valor', 'Vendas tributadas agrupadas por NCM e CFOP, do maior para o menor valor'), s: XS.title }], { ht: 24 });
      emit([{ v: 'Classificar os primeiros grupos cobre a maior parte do valor. Classificação no momento da exportação.', s: XS.note }]);
      emit(['NCM', 'CFOP', 'Descrição mais frequente', T_('Fornecedor principal', 'Cliente principal'), 'Itens', 'Classificação', 'Vlr Item', 'Motivo', 'Fundamento'], { s: XS.head, ht: 30 });
      for (const g of S.groups) {
        const cls = g.dec || g.sug.cls, s = cls === g.sug.cls ? g.sug : null;
        const part = [...g.parts.entries()].sort((a, b) => b[1] - a[1])[0];
        emit([{ v: g.ncm || '', s: XS.txt }, { v: g.cfop || '', s: XS.txt }, g.descTop, part ? part[0] : '', { v: g.n, s: XS.int }, cls, { v: r2(g.vlr), s: XS.brl }, { v: s ? s.motivo : 'Decisão do analista', s: XS.wrap }, { v: s ? s.lei : '', s: XS.wrap }]);
      }
    }
  });

  // ---------- CHECKLIST (extra) ----------
  B.addSheet({
    name: 'CHECKLIST', tab: 'FFB4372B', cols: [5, 46, 14, 10, 16, 60, 46, 80], freeze: { row: 3 },
    rows: async (emit) => {
      emit([{ v: 'Checklist automático da revisão', s: XS.title }], { ht: 24 });
      emit([{ v: 'Verificações que todo diagnóstico deve cobrir. O texto sugerido entra na minuta do relatório.', s: XS.note }]);
      emit(['#', 'Verificação', 'Situação', 'Itens', 'Valor (R$)', 'Constatação', 'O que fazer', 'Texto sugerido para o relatório'], { s: XS.head, ht: 30 });
      const stTxt = { ok: 'OK', opp: 'OPORTUNIDADE', risk: 'RISCO', warn: 'ATENÇÃO', info: 'INFORMATIVO' };
      S.checks.forEach((c, i) => emit([{ v: i + 1, s: XS.topGen }, { v: c.t, s: XS.wrap }, { v: stTxt[c.st], s: XS.topGen }, { v: c.n, s: XS.topInt }, c.v != null ? { v: c.v, s: XS.topBrl } : null, { v: c.txt, s: XS.wrap }, { v: c.acao, s: XS.wrap }, { v: c.rel || '', s: XS.wrap }], { ht: 75 }));
    }
  });

  return B.build(onProgress);
}

/* planilha "crua" no formato da exportação do SistemaMA (para testar a importação) */
async function buildRawExport(tipo) {
  const sai = tipo === 'SAI', d = sai ? buildDemoSaidas() : buildDemo();
  const B = new XlsxBook(); B.title = MODES[sai ? 'SAI' : 'ENT'].titulo;
  const hk = d.headers.map(normKey);
  const st = hk.map(k => /^vlr /.test(k) ? XS.dec : /^data |^periodo$/.test(k) ? XS.date : (TEXT_COLS.includes(k) ? XS.txt : 0));
  B.addSheet({
    name: 'Planilha', cols: hk.map(k => /descri|nome/.test(k) ? 30 : 12), rows: async (emit, y) => {
      emit(d.headers, { s: XS.bold });
      for (let i = 0; i < d.rows.length; i++) { emit(d.rows[i], { s: st }); if (i % 5000 === 4999) await y(); }
    }
  });
  return B.build();
}

/* amostra pequena (≈ 400 linhas) gravada como .xlsx e importada pelo mesmo caminho de um arquivo real: para demonstrar o processo */
async function buildSampleFile(tipo) {
  const sai = tipo === 'SAI', d = sai ? buildDemoSaidas() : buildDemo();
  const ym = r => r[1].getFullYear() * 100 + r[1].getMonth() + 1;
  let i = 0;
  const keep = sai
    ? r => { const m = ym(r); if (m < 202401 || m > 202506) return false; i++; return r[40] !== '01' || !/^[56](102|405|404)$/.test(r[33]) || /^(2522|4011)/.test(String(r[25])) || r[43] === .65 || i % 20 === 0; }
    : r => { const m = ym(r); if (m < 202501 || m > 202506) return false; i++; return r[37] !== '50' || /F150|C500|F100/.test(r[2]) || i % 9 === 0; };
  const rows = d.rows.filter(keep), hk = d.headers.map(normKey);
  const st = hk.map(k => /^vlr /.test(k) ? XS.dec : /^data |^periodo$/.test(k) ? XS.date : (TEXT_COLS.includes(k) ? XS.txt : 0));
  const B = new XlsxBook(); B.title = MODES[sai ? 'SAI' : 'ENT'].titulo;
  B.addSheet({ name: 'Planilha', cols: hk.map(k => /descri|nome/.test(k) ? 30 : 12), rows: async (emit) => { emit(d.headers, { s: XS.bold }); for (const r of rows) emit(r, { s: st }); } });
  const blob = await B.build();
  const name = MODES[sai ? 'SAI' : 'ENT'].titulo + '.xlsx';
  try { return new File([blob], name, { type: blob.type }); } catch (e) { blob.name = name; return blob; }
}

/* ===================== minuta do diagnóstico em Word (.docx) ===================== */
const W = {
  run(t, o = {}) {
    const rp = (o.b ? '<w:b/>' : '') + (o.i ? '<w:i/>' : '') + (o.caps ? '<w:caps/>' : '') +
      (o.color ? '<w:color w:val="' + o.color + '"/>' : '') + (o.sz ? '<w:sz w:val="' + o.sz + '"/><w:szCs w:val="' + o.sz + '"/>' : '') + (o.hl ? '<w:highlight w:val="' + o.hl + '"/>' : '') + (o.u ? '<w:u w:val="single"/>' : '');
    return String(t).split('\n').map((line, i) => (i ? '<w:r><w:br/></w:r>' : '') + '<w:r>' + (rp ? '<w:rPr>' + rp + '</w:rPr>' : '') + '<w:t xml:space="preserve">' + xmlEsc(line) + '</w:t></w:r>').join('');
  },
  p(content, o = {}) {
    const runs = Array.isArray(content) ? content.map(c => typeof c === 'string' ? W.run(c, o.r || {}) : W.run(c.t, c)).join('') : W.run(content, o.r || {});
    const pp = (o.style ? '<w:pStyle w:val="' + o.style + '"/>' : '') + (o.keep ? '<w:keepNext/>' : '') + (o.shd ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.shd + '"/>' : '') +

/* --- edição de texto em parágrafos do Word sem perder a formatação (o texto costuma vir quebrado em várias "runs") --- */
const DX = {
  dec: s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/&amp;/g, '&'),
  nodes(p) { const out = [], re = /<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>|<w:t(?:\s[^>]*)?\/>/g; let m; while ((m = re.exec(p))) out.push({ i: m.index, len: m[0].length, text: m[1] != null ? DX.dec(m[1]) : '' }); return out; },
  text(p) { return DX.nodes(p).map(n => n.text).join(''); },
  splice(p, a, b, novo) { // troca [a, b) do texto do parágrafo; a formatação é a da run onde o trecho começa
    const ns = DX.nodes(p); if (!ns.length) return p;
    const T = ns.map(n => n.text), st = [];
    let pos = 0, k0 = -1;
    for (let k = 0; k < ns.length; k++) { st.push(pos); if (k0 < 0 && T[k].length && a >= pos && a < pos + T[k].length) k0 = k; pos += T[k].length; }
    if (k0 < 0) { if (a !== pos) return p; k0 = ns.length - 1; while (k0 > 0 && !T[k0].length) k0--; } // trecho no fim do texto
    for (let k = k0; k < ns.length; k++) {
      const s0 = st[k], s1 = s0 + T[k].length;
      if (k === k0) T[k] = T[k].slice(0, a - s0) + novo + (b <= s1 ? T[k].slice(b - s0) : '');
      else { if (s0 >= b) break; T[k] = b >= s1 ? '' : T[k].slice(b - s0); }
    }
    let out = '', last = 0;
    ns.forEach((n, k) => { out += p.slice(last, n.i) + '<w:t xml:space="preserve">' + xmlEsc(T[k]) + '</w:t>'; last = n.i + n.len; });
    return out + p.slice(last);
  },
  replaceAll(p, find, repl) {
    if (!find) return p;
    let t = DX.text(p), i = t.indexOf(find), guard = 0;
    while (i >= 0 && guard++ < 50) { p = DX.splice(p, i, i + find.length, repl); t = DX.text(p); i = t.indexOf(find, i + repl.length); }
    return p;
  },
  replaceRe(p, re, fn) { const t = DX.text(p), m = re.exec(t); if (!m) return null; return DX.splice(p, m.index, m.index + m[0].length, fn(m)); },
  setText(p, novo) { return DX.splice(p, 0, DX.text(p).length, novo); },
  pPr(p) { const m = /<w:pPr>[\s\S]*?<\/w:pPr>/.exec(p); return m ? m[0] : ''; },
  rPr(p) { const m = /<w:r(?:\s[^>]*)?>\s*(<w:rPr>[\s\S]*?<\/w:rPr>)/.exec(p); return m ? m[1] : ''; },
  hlRun(t, rPr) { // run destacada em amarelo, com a formatação da run original quando houver
    let rp = rPr || '<w:rPr></w:rPr>';
    if (!/<w:highlight /.test(rp)) rp = rp.replace('</w:rPr>', '<w:highlight w:val="yellow"/></w:rPr>');
    return '<w:r>' + rp + '<w:t xml:space="preserve">' + xmlEsc(t) + '</w:t></w:r>';
  },
  /* parágrafos mais internos (os que contêm o texto), em ordem, com início e fim no XML */
  paras(x) {
    const out = [], stack = [], re = /<w:p(?=[\s>\/])[^>]*?(\/?)>|<\/w:p>/g; let m;
    while ((m = re.exec(x))) {
      if (m[0] === '</w:p>') { const st = stack.pop(); if (st && !st.child) out.push({ a: st.a, b: m.index + 6 }); if (stack.length) stack[stack.length - 1].child = true; }
      else if (m[1] !== '/') { if (stack.length) stack[stack.length - 1].child = true; stack.push({ a: m.index, child: false }); }
    }
    return out.sort((p, q) => p.a - q.a);
  }
};

/* --- tabelas no padrão do diagnóstico (cabeçalho preto, valores à direita) --- */
function dxTabela(cols, rows, o = {}) {
  const W = cols.reduce((a, c) => a + c.w, 0);
  const brd = '<w:tblBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="000000"/></w:tblBorders>';
  const cell = (t, c, f) => '<w:tc><w:tcPr><w:tcW w:w="' + c.w + '" w:type="dxa"/>' + (f.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + f.fill + '"/>' : '') + '</w:tcPr><w:p><w:pPr><w:spacing w:before="20" w:after="20" w:line="240" w:lineRule="auto"/><w:jc w:val="' + (c.right ? 'right' : 'left') + '"/></w:pPr><w:r><w:rPr>' + (f.b ? '<w:b/>' : '') + (f.color ? '<w:color w:val="' + f.color + '"/>' : '') + (f.hl ? '<w:highlight w:val="yellow"/>' : '') + '<w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr><w:t xml:space="preserve">' + xmlEsc(t == null ? '' : String(t)) + '</w:t></w:r></w:p></w:tc>';
  let x = '<w:tbl><w:tblPr><w:tblW w:w="' + W + '" w:type="dxa"/><w:jc w:val="center"/>' + brd + '<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>' + cols.map(c => '<w:gridCol w:w="' + c.w + '"/>').join('') + '</w:tblGrid>';
  x += '<w:tr><w:trPr><w:tblHeader/></w:trPr>' + cols.map(c => cell(c.h, c, { fill: '000000', b: true, color: 'FFFFFF' })).join('') + '</w:tr>';
  rows.forEach((r, i) => { const tot = o.totalLast && i === rows.length - 1; x += '<w:tr><w:trPr><w:cantSplit/></w:trPr>' + cols.map((c, j) => cell(r[j], c, { b: tot || j === 0, hl: o.hl && o.hl(i, j) })).join('') + '</w:tr>'; });
  return x + '</w:tbl>';
}

/* --- preenchimento --- */
async function preencherModelo(bytes, d) {

  const cnpjAnt = (/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/.exec(todo) || [null])[0];
  const perAnt = (/\d{2}\/\d{4}\s+A\s+\d{2}\/\d{4}/.exec(todo) || [null])[0];
  const nome = (d.nome || '').trim().toLocaleUpperCase('pt-BR'), cnpj = fmtCNPJ(d.cnpj);
  const tot = { linhas: [] };

  // 2. troca parágrafo a parágrafo (de trás para frente, para não deslocar as posições)
  const ps = DX.paras(doc);
  const imgDepois = new Map(); // parágrafo de imagem que vem logo depois de um título conhecido
  const marca = (k, i) => { if (!imgDepois.has(k)) imgDepois.set(k, i); };
  let alvo = null;
  ps.forEach((pp, i) => {
    const t = textos[i];
    if (/Evolu[cç][aã]o da Ca\w*ga Tribut[aá]ria/i.test(t)) alvo = 'grafEvol';
    else if (/Carga Tribut[aá]ria PIS E COFINS/i.test(t)) alvo = 'grafPC';
    else if (/Carga Tribut[aá]ria ICMS/i.test(t)) alvo = 'grafICMS';
    else if (/montante total a recuperar equivalente/i.test(t)) alvo = 'ncms';
    else if (/^\s*CONCLUS[AÃ]O\s*$/i.test(t)) alvo = 'resumo';
    const xml = doc.slice(pp.a, pp.b);
    if (alvo && /r:(embed|id)="[^"]+"/.test(xml) && /<w:drawing>|<w:pict|<w:object/.test(xml)) { marca(alvo, i); alvo = null; }
  });
  let capaLogo = -1;
  for (let i = 0; i < ps.length; i++) { const xml = doc.slice(ps[i].a, ps[i].b); if (/^\s*.+?,\s*\d{1,2}\s+de\s+[a-zç]+\s+de\s+\d{4}\.?\s*$/i.test(textos[i])) break; if (/<w:drawing>|<w:pict/.test(xml) && /r:(embed|id)="/.test(xml)) { capaLogo = i; break; } }

  const regs = {
    ent: R.ENT, sai: R.SAI,
    ini: Math.min(...[R.ENT, R.SAI].filter(Boolean).map(r => r.ini)), fim: Math.max(...[R.ENT, R.SAI].filter(Boolean).map(r => r.fim))
  };
  const anosReg = {}; [R.ENT, R.SAI].filter(Boolean).forEach(r => { for (const [a, v] of Object.entries(r.anosReg)) { const x = anosReg[a] || (anosReg[a] = { NC: 0, CUM: 0, SEM: 0 }); x.NC = Math.max(x.NC, v.NC); x.CUM = Math.max(x.CUM, v.CUM); x.SEM = Math.max(x.SEM, v.SEM); } });
  const regAtual = (R.SAI && R.SAI.regimeAtual) || (R.ENT && R.ENT.regimeAtual);
  const regAtualTxt = regAtual === 'CUM' ? 'LUCRO PRESUMIDO' : regAtual === 'NC' ? 'LUCRO REAL' : null;
  const cumAnos = Object.keys(anosReg).map(Number).filter(a => anosReg[a].CUM > anosReg[a].NC).sort();
  const ncAnos = Object.keys(anosReg).map(Number).filter(a => anosReg[a].NC > 0 && anosReg[a].NC >= anosReg[a].CUM).sort();
